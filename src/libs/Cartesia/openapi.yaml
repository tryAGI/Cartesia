        - APIKeyAuth: []
  /agents/calls/batches/{batch_id}/cancel:
    post:
      tags:
        - Agents
      summary: Cancel Call Batch
      description: >-
        Stops dialing the batch's queued calls. Calls already in flight are left
        to finish. Idempotent.
      operationId: agents_cancel-call-batch
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: batch_id
          in: path
          description: The ID of the batch.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The batch was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCallBatch'
        '404':
          description: Batch not found.
      security:
        - APIKeyAuth: []
  /agents/calls/batches/{batch_id}/retry:
    post:
      tags:
        - Agents
      summary: Retry Call Batch
      description: >-
        Re-queues the batch's recipients whose latest call attempt failed or
        went unanswered, so the dispatcher dials them again. Recipients that
        successfully completed their call are left untouched. A cancelled batch
        cannot be retried.
      operationId: agents_retry-call-batch
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: batch_id
          in: path
          description: The ID of the batch.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The batch, with its failed recipients re-queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCallBatch'
        '400':
          description: Batch is cancelled and cannot be retried.
        '404':
          description: Batch not found.
      security:
        - APIKeyAuth: []
  /agents/phone-numbers:
