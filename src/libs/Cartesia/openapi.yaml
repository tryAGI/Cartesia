        Names are case-sensitive, up to 64 characters, and use letters, digits,
        or underscores. Start with a letter or underscore; `system__` and
        `secret__` prefixes are reserved. Limited to 16 KiB of UTF-8 JSON.
    AgentCallBatchRequest:
      title: AgentCallBatchRequest
      type: object
      description: Request body for queueing a batch of outbound calls.
      properties:
        name:
          type: string
          description: A label for the batch.
        agent_id:
          type: string
          description: The identifier of the agent that handles the batch's calls.
        from_number_id:
          type: string
          description: >-
            The identifier of the phone number to place calls from. The attached
            provider handles outbound calling for this number.
        recipients:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: '#/components/schemas/AgentOutboundCallItem'
          description: Destinations and optional per-call dynamic variables
        target_concurrency_limit:
          type: integer
          minimum: 1
          description: >-
            Maximum number of calls from this batch to dial concurrently. Must
            not exceed the organization's concurrency limit. Omit to default to
            half of the organization's agent-call concurrency limit, leaving
            headroom for other calls.
        ringing_timeout_seconds:
          type: integer
          minimum: 5
          maximum: 80
          description: >-
            Seconds to wait for the callee to answer before giving up. Omit to
            use the default (60 seconds).
        max_call_duration_minutes:
          type: integer
          minimum: 1
          maximum: 480
          description: >-
            Maximum call duration in minutes. Omit to use the default (480
            minutes).
        scheduled_at:
          type: string
          format: date-time
          description: >-
            When to start dispatching the batch, as an RFC3339 timestamp with a
            timezone offset (e.g. `2026-06-15T16:00:00Z`). Must be in the future
            and within 30 days. Omit to dispatch immediately.
        region:
          type: string
          enum:
            - US
            - EU
            - APAC
          description: >-
            The region from which the batch's outbound calls are dispatched.
            Valid only when `from_number_id` is a SIP-trunk number; rejected for
            other telephony account types. Omit to derive the region from the
            telephony account.
      required:
        - name
        - agent_id
        - from_number_id
        - recipients
    AgentCallBatch:
      title: AgentCallBatch
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the batch.
        name:
          type: string
          description: The batch's label.
        agent_id:
          type: string
          description: The identifier of the agent that handles the batch's calls.
        from_number_id:
          type: string
          description: The identifier of the phone number the batch dials from.
        region:
          type: string
          enum:
            - US
            - EU
            - APAC
          description: The region that handles the batch.
        target_concurrency_limit:
          type: integer
          description: Maximum number of calls from this batch dialed concurrently.
        status:
          $ref: '#/components/schemas/AgentCallBatchStatus'
          description: >-
            The batch's lifecycle status, derived at read time from dispatch
            progress.


            | Status | Meaning |

            | --- | --- |

            | `pending` | No calls dispatched yet |

            | `in_progress` | Some calls dispatched, not all |

            | `completed` | All recipients dispatched |

            | `failed` | All recipients failed before dialing |

            | `cancelled` | Cancelled before every call was dispatched |
        total_calls_scheduled:
          type: integer
          description: Total recipients queued in the batch.
        total_calls_dispatched:
          type: integer
          description: >-
            Recipients handed to the dialer so far, including those that failed
            before a call could be placed.
        total_calls_finished:
          type: integer
          description: >-
            Recipients whose latest call attempt reached a terminal state
            (completed or failed), including pre-dial failures.
        retry_count:
          type: integer
          description: >-
            Number of times the batch has been retried. `0` until the first
            retry.
        created_at:
          type: string
          format: date-time
          description: When the batch was created.
        last_updated_at:
          type: string
          format: date-time
          description: When the batch was last updated.
        scheduled_at:
          type: string
          format: date-time
          description: >-
            The scheduled dispatch time, in RFC3339 UTC format. Omitted for
            batches that dispatch immediately.
        admitted_at:
          type: string
          format: date-time
          description: >-
            The actual dispatch time, in RFC3339 UTC format. The batch may stay
            unadmitted in the queue due to scheduling or unavailable
            concurrency.
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/AgentCallBatchRecipient'
          description: >-
            The batch's recipients. Returned only on `GET
            /agents/calls/batches/{batch_id}`.
      required:
        - id
        - name
        - agent_id
        - from_number_id
        - region
        - target_concurrency_limit
        - status
        - total_calls_scheduled
        - total_calls_dispatched
        - total_calls_finished
        - retry_count
        - created_at
        - last_updated_at
    AgentCallBatchStatus:
      title: AgentCallBatchStatus
      type: string
      enum:
        - pending
        - in_progress
        - completed
        - failed
        - cancelled
      description: >-
        The lifecycle status of a batch, derived at read time from dispatch
        progress.
    AgentCallBatchRecipient:
      title: AgentCallBatchRecipient
      type: object
      description: >-
        One recipient within a batch and its current status. Returned only on
        batch detail reads.
      properties:
        id:
          type: string
          description: The unique identifier for the recipient within the batch.
        to_number:
          type: string
          description: Destination phone number, in E.164 format (e.g., `+14155559876`).
        status:
          $ref: '#/components/schemas/AgentCallBatchRecipientStatus'
          description: >-
            The recipient's current status. Before dispatch it reflects the
            queue state; after dispatch it reflects the latest call attempt.


            | Status | Meaning |

            | --- | --- |

            | `queued` | Waiting for the dispatcher |

            | `dispatched` | Handed to the dialer; no call attempt has connected
            or finished yet |

            | `started` | Call connected and in progress |

            | `completed` | Call connected and ended successfully |

            | `failed` | The call could not be placed (see `error_message`), or
            the latest attempt failed |

            | `cancelled` | Batch was cancelled before this recipient was dialed
            |
        agent_call_id:
          type: string
          description: >-
            The agent call ID, used to fetch per-call information via [Get
            Call](/api-reference/agents/calls/get-call). Set once the call has
            been dispatched.
        end_reason:
          $ref: '#/components/schemas/EndReason'
          description: The reason why the call ended.
        error_message:
          type: string
          description: >-
            Why the request failed before a call could be placed. Returned in
            place of `agent_call_id` when the recipient never reached a dial
            attempt.
        created_at:
          type: string
          format: date-time
          description: When the recipient was queued.
      required:
        - id
        - to_number
        - status
        - created_at
    AgentCallBatchRecipientStatus:
      title: AgentCallBatchRecipientStatus
      type: string
      description: >-
        The status of a recipient within a batch. Before dispatch it reflects
        the queue state; after dispatch it reflects the latest call attempt.
    ListAgentCallBatchesResponse:
      title: ListAgentCallBatchesResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentCallBatch'
          description: The list of batches, newest first.
        next_page:
          type: string
          nullable: true
          description: >-
            An ID that can be passed as `starting_after` or `ending_before` to
            get the next page of batches.
        has_more:
          type: boolean
          description: Whether there are more results available.
      required:
        - data
        - has_more
    PhoneNumberResponse:
      title: PhoneNumberResponse
      description: A phone number with its provider and agent assignment details.
      allOf:
        - $ref: '#/components/schemas/PhoneNumberBaseResponse'
        - type: object
          properties:
            provider:
              $ref: '#/components/schemas/ProviderResponse'
          required:
            - provider
    PhoneNumberBaseResponse:
      title: PhoneNumberBaseResponse
      type: object
      description: Common phone number fields.
      properties:
        id:
          type: string
          description: Unique identifier for the phone number.
        label:
          type: string
          nullable: true
          description: A human-readable name for the phone number.
        number:
          type: string
          description: The phone number in E.164 format (e.g. +14155551234).
        agent:
          nullable: true
          description: >-
            The agent that answers inbound calls to this number, or `null` if
            unassigned
          type: object
          properties:
            id:
              type: string
            name:
              type: string
          required:
            - id
            - name
        created_at:
          type: string
          format: date-time
          description: UTC timestamp when the phone number was created.
        updated_at:
          type: string
          format: date-time
          description: UTC timestamp when the phone number was last updated.
      required:
        - id
        - number
        - agent
        - created_at
        - updated_at
    ProviderResponse:
      title: Provider
      description: >-
        The telephony provider associated with a phone number. One of `Twilio`,
        `Cartesia`, or `SIP Trunk`, determined by the `type` field. For SIP
        trunk numbers, `inbound` and `outbound` are not returned here — use `GET
        /agents/phone-numbers/providers/{id}` to retrieve them.
      oneOf:
        - $ref: '#/components/schemas/TwilioProviderResponse'
        - $ref: '#/components/schemas/CartesiaProviderResponse'
        - $ref: '#/components/schemas/SIPTrunkEmbeddedResponse'
      discriminator:
        propertyName: type
        mapping:
          twilio:
            $ref: '#/components/schemas/TwilioProviderResponse'
          cartesia:
            $ref: '#/components/schemas/CartesiaProviderResponse'
          sip_trunk:
            $ref: '#/components/schemas/SIPTrunkEmbeddedResponse'
    TwilioProviderResponse:
      title: Twilio
      type: object
      description: >-
        A linked Twilio account. The `api_key_sid` field is partially masked in
        responses.
      properties:
        type:
          type: string
          enum:
            - twilio
          description: Always `"twilio"`.
        id:
          type: string
          description: Unique identifier for the provider.
        account_sid:
          type: string
          description: The Twilio account SID.
        api_key_sid:
          type: string
          description: The Twilio API key SID (partially masked).
        region:
          $ref: '#/components/schemas/TelephonyRegion'
        label:
          type: string
          nullable: true
          description: A human-readable label for the provider.
      required:
        - type
        - id
        - account_sid
        - api_key_sid
        - region
    CartesiaProviderResponse:
      title: Cartesia
      type: object
      description: A Cartesia-managed provider. US phone numbers only.
      properties:
        type:
          type: string
          enum:
            - cartesia
          description: Always `"cartesia"`.
      required:
        - type
    SIPTrunkEmbeddedResponse:
      title: SIP Trunk
      type: object
      description: A linked SIP trunk provider.
      properties:
        type:
          type: string
          enum:
            - sip_trunk
          description: Always `"sip_trunk"`.
        id:
          type: string
          description: Unique identifier for the provider.
        label:
          type: string
          nullable: true
          description: A human-readable label for the provider.
      required:
        - type
        - id
    TelephonyRegion:
      title: TelephonyRegion
      type: string
      enum:
        - us1
        - ie1
        - au1
      description: >-
        The Twilio region the phone number and API key are configured for. `us1`
        (US), `ie1` (Ireland), `au1` (Australia). Default is `us1`.
      default: us1
    ImportPhoneNumberBody:
      title: ImportPhoneNumberBody
      type: object
      description: >-
        Request body for importing a phone number from an existing provider.

        The number of Cartesia phone numbers is limited by your subscription
        plan.
      properties:
        label:
          type: string
          description: A human-readable name for the phone number.
        number:
          type: string
          description: The phone number in E.164 format.
        provider:
          description: >-
            Reference to the provider. Pass `{ "id": "..." }` for an existing
            provider, or `{ "type": "twilio", "account_sid": "...", "region":
            "..." }` to look up by account.
          oneOf:
            - type: object
              title: By ID
              properties:
                id:
                  type: string
              required:
                - id
            - type: object
              title: By Twilio Account
              properties:
                type:
                  type: string
                  enum:
                    - twilio
                account_sid:
                  type: string
                region:
                  $ref: '#/components/schemas/TelephonyRegion'
              required:
                - type
                - account_sid
        agent_id:
          type: string
          description: >-
            Optionally assign an agent to answer inbound calls to this number.
            Omit to keep the number outbound-only.
      required:
        - label
        - number
        - provider
    ProvisionPhoneNumberBody:
      title: ProvisionPhoneNumberBody
      type: object
      description: Request body for provisioning a new Cartesia-managed phone number.
      properties:
        label:
          type: string
          description: A human-readable name for the phone number.
        agent_id:
          type: string
          description: >-
            Optionally assign an agent to answer inbound calls to this number.
            Omit to keep the number outbound-only.
      required:
        - label
    ProvisionPhoneNumberResponse:
      title: ProvisionPhoneNumberResponse
      description: The number supports inbound calls and outbound calls to US numbers only
      allOf:
        - $ref: '#/components/schemas/PhoneNumberBaseResponse'
    UpdatePhoneNumberBody:
      title: UpdatePhoneNumberBody
      type: object
      description: >-
        Fields to update on a phone number. All fields are optional. Set
        `agent_id` to `null` to unassign the current agent.
      properties:
        label:
          type: string
          description: A new human-readable name.
        agent_id:
          type: string
          nullable: true
          description: >-
            Assign an agent to answer inbound calls to this number, or `null` to
            unassign.
        provider:
          description: >-
            Change the provider. Pass `{ "id": "..." }` for an existing
            provider, or pass Twilio account fields for lookup convenience. For
            Twilio, the phone number must exist in the target provider account.
            For SIP trunk providers, Cartesia handles reassignment between SIP
            providers. Switching between provider types is not supported; delete
            and re-import the number instead.
          oneOf:
            - type: object
              title: By ID
              properties:
                id:
                  type: string
              required:
                - id
            - type: object
              title: By Twilio Account
              properties:
                type:
                  type: string
                  enum:
                    - twilio
                account_sid:
                  type: string
                region:
                  $ref: '#/components/schemas/TelephonyRegion'
              required:
                - type
                - account_sid
    ProviderAccountResponse:
      title: Provider Account
      description: A telephony provider account.
      oneOf:
        - $ref: '#/components/schemas/TwilioProviderResponse'
        - $ref: '#/components/schemas/SIPTrunkProviderResponse'
      discriminator:
        propertyName: type
        mapping:
          twilio:
            $ref: '#/components/schemas/TwilioProviderResponse'
          sip_trunk:
            $ref: '#/components/schemas/SIPTrunkProviderResponse'
    SIPTrunkProviderResponse:
      title: SIP Trunk
      type: object
      description: A linked SIP trunk provider.
      properties:
        type:
          type: string
          enum:
            - sip_trunk
          description: Always `"sip_trunk"`.
        id:
          type: string
          description: Unique identifier for the provider.
        label:
          type: string
          nullable: true
          description: A human-readable label for the provider.
        inbound:
          description: Inbound configuration. Present when inbound is configured.
          allOf:
            - $ref: '#/components/schemas/SIPTrunkInboundDetails'
        outbound:
          description: Outbound configuration. Present when outbound is configured.
          allOf:
            - $ref: '#/components/schemas/SIPTrunkOutboundDetails'
      required:
        - type
        - id
    SIPTrunkInboundDetails:
      title: SIPTrunkInboundDetails
      type: object
      description: >-
        Inbound SIP configuration. Passwords are never returned; only the
        configured username is exposed as `auth_username`.
      properties:
        allowed_addresses:
          type: array
          items:
            type: string
          description: Source IP addresses or CIDR ranges allowed to send SIP traffic.
        allowed_numbers:
          type: array
          items:
            type: string
          description: Caller numbers allowed on inbound calls.
        auth_username:
          type: string
          description: SIP username returned without the password.
        media_encryption:
          description: Media encryption policy. Defaults to `allowed`.
          allOf:
            - $ref: '#/components/schemas/SIPMediaEncryption'
      required:
        - allowed_addresses
        - allowed_numbers
        - auth_username
        - media_encryption
    SIPTrunkOutboundDetails:
      title: SIPTrunkOutboundDetails
      type: object
      description: >-
        Outbound SIP configuration. Passwords are never returned; only the
        configured username is exposed as `auth_username`.
      properties:
        address:
          type: string
          description: SIP server hostname or address used for outbound signaling.
        destination_country:
          type: string
          description: >-
            Two-letter ISO 3166-1 alpha-2 destination country code, or an empty
            string if not set.
        transport:
          $ref: '#/components/schemas/SIPTrunkTransport'
        media_encryption:
          description: Media encryption policy. Defaults to `disabled`.
          allOf:
            - $ref: '#/components/schemas/SIPMediaEncryption'
        auth_username:
          type: string
          description: SIP username returned without the password.
      required:
        - address
        - transport
        - media_encryption
        - auth_username
    SIPMediaEncryption:
      title: SIPMediaEncryption
      type: string
      enum:
        - disabled
        - allowed
        - required
      description: >-
        SRTP policy for call audio. `disabled` does not negotiate encryption,
        `allowed` uses encryption when available, and `required` rejects calls
        that cannot use encryption.
    SIPTrunkTransport:
      title: SIPTrunkTransport
      type: string
      enum:
        - tcp
        - tls
      description: Transport for outbound SIP signaling.
    CreateProviderBody:
      title: Create Provider
      description: |-
        Request body for linking a telephony provider. Discriminated by `type`.
        **Twilio**:
          - Credentials are validated against Twilio before the provider is created
          - Each account SID + region combination can only be linked once
      oneOf:
        - $ref: '#/components/schemas/CreateTwilioProviderBody'
        - $ref: '#/components/schemas/CreateSIPProviderBody'
      discriminator:
        propertyName: type
        mapping:
          twilio:
            $ref: '#/components/schemas/CreateTwilioProviderBody'
          sip_trunk:
            $ref: '#/components/schemas/CreateSIPProviderBody'
    CreateTwilioProviderBody:
      title: Twilio
      type: object
      properties:
        type:
          type: string
          enum:
            - twilio
          description: Must be `"twilio"`.
        account_sid:
          type: string
          description: Your Twilio account SID.
        api_key_sid:
          type: string
          description: A Twilio API key SID.
        api_key_secret:
          type: string
          format: password
          description: The corresponding API key secret.
        region:
          $ref: '#/components/schemas/TelephonyRegion'
          default: us1
        label:
          type: string
          minLength: 1
          description: An optional human-readable label for the provider.
      required:
        - type
        - account_sid
        - api_key_sid
        - api_key_secret
    CreateSIPProviderBody:
      title: SIP Trunk
      type: object
      description: >-
        Link a SIP trunk provider. At least one of `inbound` or `outbound` is
        required.
      properties:
        type:
          type: string
          enum:
            - sip_trunk
          description: Must be `"sip_trunk"`.
        label:
          type: string
          minLength: 1
          description: A human-readable label for the provider.
        inbound:
          $ref: '#/components/schemas/InboundSIPTrunkConfig'
        outbound:
          $ref: '#/components/schemas/OutboundSIPTrunkConfig'
      anyOf:
        - required:
            - inbound
        - required:
            - outbound
      required:
        - type
        - label
    InboundSIPTrunkConfig:
      title: InboundSIPTrunkConfig
      type: object
      description: Inbound SIP configuration for creating a trunk.
      properties:
        credentials:
          $ref: '#/components/schemas/SIPCredentials'
        allowed_addresses:
          type: array
          items:
            type: string
          description: Source IP addresses or CIDR ranges allowed to send SIP traffic.
        allowed_numbers:
          type: array
          items:
            type: string
          description: Caller numbers allowed on inbound calls.
        media_encryption:
          description: Media encryption policy. Defaults to `allowed`.
          allOf:
            - $ref: '#/components/schemas/SIPMediaEncryption'
    OutboundSIPTrunkConfig:
      title: OutboundSIPTrunkConfig
      type: object
      description: Outbound SIP configuration for creating a trunk.
      properties:
        address:
          type: string
          minLength: 1
          description: SIP server hostname or address used for outbound signaling.
        transport:
          $ref: '#/components/schemas/SIPTrunkTransport'
        destination_country:
          $ref: '#/components/schemas/Iso3166Alpha2CountryCode'
        media_encryption:
          description: Media encryption policy. Defaults to `disabled`.
          allOf:
            - $ref: '#/components/schemas/SIPMediaEncryption'
        credentials:
          $ref: '#/components/schemas/SIPCredentials'
      required:
        - address
        - transport
    SIPCredentials:
      title: SIPCredentials
      type: object
      description: SIP digest authentication credentials.
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
      required:
        - username
        - password
    Iso3166Alpha2CountryCode:
      title: Iso3166Alpha2CountryCode
      type: string
      minLength: 2
      maxLength: 2
      pattern: ^[A-Za-z]{2}$
      description: >-
        Two-letter country code for the country the call terminates in (e.g.
        `US`, `GB`, `DE`). See [ISO 3166-1
        alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
    UpdateProviderBody:
      title: Update Provider
      description: Request body for updating a provider. Discriminated by `type`.
      oneOf:
        - $ref: '#/components/schemas/UpdateTwilioProviderBody'
        - $ref: '#/components/schemas/UpdateSIPTrunkProviderBody'
      discriminator:
        propertyName: type
        mapping:
          twilio:
            $ref: '#/components/schemas/UpdateTwilioProviderBody'
          sip_trunk:
            $ref: '#/components/schemas/UpdateSIPTrunkProviderBody'
    UpdateTwilioProviderBody:
      title: Twilio
      type: object
      description: >-
        Update Twilio API key credentials and optionally the region. Cartesia
        validates the credentials and rejects the update with a list of
        unreachable numbers assigned to agents.
      properties:
        type:
          type: string
          enum:
            - twilio
          description: Must be `"twilio"`.
        api_key_sid:
          type: string
          description: New Twilio API key SID.
        api_key_secret:
          type: string
          format: password
          description: New API key secret.
        region:
          $ref: '#/components/schemas/TelephonyRegion'
      required:
        - type
        - api_key_sid
        - api_key_secret
    UpdateSIPTrunkProviderBody:
      title: SIP Trunk
      type: object
      description: >-
        Update a SIP trunk provider's inbound and/or outbound configuration.
        Merge-patch semantics: omitted fields are unchanged. To add outbound to
        an inbound-only provider, send `outbound` with both `address` and
        `transport`.
      properties:
        type:
          type: string
          enum:
            - sip_trunk
          description: Must be `"sip_trunk"`.
        label:
          type: string
          minLength: 1
          description: >-
            A new human-readable label for the provider. Omit to leave
            unchanged.
        inbound:
          $ref: '#/components/schemas/UpdateInboundSIPTrunkConfig'
        outbound:
          $ref: '#/components/schemas/UpdateOutboundSIPTrunkConfig'
      required:
        - type
    UpdateInboundSIPTrunkConfig:
      title: UpdateInboundSIPTrunkConfig
      type: object
      description: >-
        Inbound SIP configuration for updating a trunk. Omitted fields remain
        unchanged. Send `[]` to clear an allowlist.
      properties:
        credentials:
          $ref: '#/components/schemas/UpdateSIPCredentials'
        allowed_addresses:
          type: array
          items:
            type: string
          description: Source IP addresses or CIDR ranges allowed to send SIP traffic.
        allowed_numbers:
          type: array
          items:
            type: string
          description: Caller numbers allowed on inbound calls.
        media_encryption:
          description: Media encryption policy.
          allOf:
            - $ref: '#/components/schemas/SIPMediaEncryption'
    UpdateOutboundSIPTrunkConfig:
      title: UpdateOutboundSIPTrunkConfig
      type: object
      description: >-
        Outbound SIP configuration for updating a trunk. `address` and
        `transport` are immutable on an existing outbound trunk, but required
        when adding outbound to an inbound-only provider.
      properties:
        address:
          type: string
          minLength: 1
          description: Required only when adding outbound to an inbound-only provider.
        transport:
          description: Required only when adding outbound to an inbound-only provider.
          allOf:
            - $ref: '#/components/schemas/SIPTrunkTransport'
        destination_country:
          type: string
          nullable: true
          minLength: 2
          maxLength: 2
          pattern: ^[A-Za-z]{2}$
          description: Send `null` to clear.
        media_encryption:
          description: Media encryption policy. Omit to leave unchanged.
          allOf:
            - $ref: '#/components/schemas/SIPMediaEncryption'
        credentials:
          $ref: '#/components/schemas/UpdateSIPCredentials'
    UpdateSIPCredentials:
      title: UpdateSIPCredentials
      type: object
      nullable: true
      description: >-
        SIP digest authentication credentials for an update. The username is
        required when credentials are provided. Omit the password to keep the
        stored secret, or send `null` to clear the credentials.
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
      required:
        - username
    ListMetricsResponse:
      title: ListMetricsResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
          description: List of metrics.
        has_more:
          type: boolean
          description: Whether there are more metrics to fetch.
        next_page:
          type: string
          nullable: true
          description: >-
            An ID that can be passed as `starting_after` or `ending_before` to
            get the next page of metrics.
      required:
        - data
        - has_more
    Metric:
      title: Metric
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the metric.
        name:
          type: string
          description: >-
            The name of the metric. This is a unique name that you can use to
            identify the metric in the CLI.
        display_name:
          type: string
          nullable: true
          description: >-
            The display name of the metric, if available. This is the name that
            is displayed in the Playground.
        prompt:
          type: string
          description: >-
            The prompt associated with the metric, detailing the task and
            evaluation criteria.
        created_at:
          type: string
          format: date-time
          description: The timestamp when the metric was created.
      required:
        - id
        - name
        - prompt
        - created_at
    CreateMetricRequest:
      title: CreateMetricRequest
      type: object
      properties:
        name:
          type: string
          description: >-
            The name of the metric. This must be a unique name that only allows
            lower case letters, numbers, and the characters _, -, and .
        display_name:
          type: string
          nullable: true
          description: The display name of the metric.
        prompt:
          type: string
          description: >-
            The prompt associated with the metric, detailing the task and
            evaluation criteria.
      required:
        - name
        - prompt
    ListMetricResultsResponse:
      title: ListMetricResultsResponse
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MetricResult'
          description: List of metric results.
        has_more:
          type: boolean
          description: Whether there are more metric results to fetch.
        next_page:
          type: string
          nullable: true
          description: >-
            An ID that can be passed as `starting_after` or `ending_before` to
            get the next page of metric results.
      required:
        - data
        - has_more
    MetricResult:
      title: MetricResult
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the metric result.
        metricId:
          type: string
          description: The identifier of the metric being measured.
        metricName:
          type: string
          description: The name of the metric being measured.
        metricDisplayName:
          type: string
          nullable: true
          description: The display name of the metric, if available.
        summary:
          type: string
          description: A summary of the transcript of the call.
        transcript:
          type: array
          items:
            $ref: '#/components/schemas/AgentTranscript'
          nullable: true
          description: The transcript of the call.
        agentId:
          type: string
          description: The identifier of the agent associated with the metric result.
        callId:
          type: string
          description: The identifier of the call associated with the metric result.
        result:
          type: string
          description: The raw result of the metric in a string format.
        jsonResult:
          type: object
          additionalProperties: true
          nullable: true
          description: The structured JSON result of the metric.
        value:
          nullable: true
          description: The value of the metric result.
        status:
          $ref: '#/components/schemas/AgentMetricResultStatus'
          description: The status of the metric result.
        runId:
          type: string
          nullable: true
          description: >-
            The identifier of the run associated with the metric result, if
            applicable.
        createdAt:
          type: string
          format: date-time
          description: The UTC timestamp when the metric result was created.
      required:
        - id
        - metricId
        - metricName
        - summary
        - agentId
        - callId
        - result
        - status
        - createdAt
    AgentMetricResultStatus:
      title: AgentMetricResultStatus
      type: string
      enum:
        - completed
        - failed
      description: >-
        The status of an agent metric result. `failed` indicates that the metric
        result was not computed or parsed properly.
    TokenRequest:
      title: TokenRequest
      type: object
      properties:
        grants:
          $ref: '#/components/schemas/TokenGrant'
          nullable: true
          description: >-
            The permissions to be granted via the token. Both TTS and STT grants
            are optional - specify only the capabilities you need.
        expires_in:
          type: integer
          nullable: true
          description: >-
            The number of seconds the token will be valid for since the time of
            generation. The maximum is 1 hour (3600 seconds).
    TokenResponse:
      title: TokenResponse
      type: object
      properties:
        token:
          type: string
          description: The generated Access Token.
      required:
        - token
    TokenGrant:
      title: TokenGrant
      type: object
      properties:
        tts:
          type: boolean
          nullable: true
          description: >-
            The `tts` grant allows the token to be used to access any TTS
            endpoint.
        stt:
          type: boolean
          nullable: true
          description: >-
            The `stt` grant allows the token to be used to access any STT
            endpoint.
        agent:
          type: boolean
          nullable: true
          description: >-
            The `agent` grant allows the token to be used to access the Agent
            websocket calling [endpoint](/line/integrations/websocket-api).
    GenderPresentation:
      title: GenderPresentation
      type: string
      enum:
        - masculine
        - feminine
        - gender_neutral
    VoiceExpandOptions:
      title: VoiceExpandOptions
      type: string
      enum:
        - preview_file_url
    GetVoicesResponse:
      title: GetVoicesResponse
      type: object
