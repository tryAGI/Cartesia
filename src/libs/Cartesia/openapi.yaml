        - started
        - completed
        - failed
      description: The status of an agent call.
    EndReason:
      title: EndReason
      type: string
      enum:
        - agent_hangup
        - client_hangup
        - api_cancelled
        - max_duration
        - inactivity
        - client_disconnected
        - dial_busy
        - dial_failed
        - dial_no_answer
        - error
      description: A machine-readable enum indicating why a call ended.
    ToolCall:
      title: ToolCall
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the tool call.
        name:
          type: string
          description: The name of the tool that was called.
        arguments:
          type: object
          additionalProperties: true
          description: >-
