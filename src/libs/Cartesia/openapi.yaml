  /agents/calls/batches:
    post:
      tags:
        - Agents
      summary: Create Call Batch
      description: >-
        Queues a batch of outbound calls. Calls are issued gradually, subject to
        the organization's and the batch's concurrency limits.
      operationId: agents_create-call-batch
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCallBatchRequest'
      responses:
        '201':
          description: The created batch, with all of its call requests queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCallBatch'
        '400':
          description: >-
            Invalid request or recipient. Dynamic variable errors identify the
            first failing recipient as `recipients[index]`. No batch is created.
        '402':
          description: >-
            The organization has reached its agents usage limit. Upgrade the
            subscription or enable overages.
        '404':
          description: Agent or phone number not found.
        '500':
          description: The batch could not be created.
      security:
        - APIKeyAuth: []
    get:
      tags:
        - Agents
      summary: List Call Batches
      operationId: agents_list-call-batches
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: agent_id
          in: query
          description: Filter to batches for this agent.
          required: false
          schema:
            type: string
            nullable: true
        - name: starting_after
          in: query
          description: (Pagination option) The ID of the batch to start after.
          required: false
          schema:
            type: string
            nullable: true
        - name: ending_before
          in: query
          description: (Pagination option) The ID of the batch to end before.
          required: false
          schema:
            type: string
            nullable: true
        - name: limit
          in: query
          description: >-
            (Pagination option) The number of batches to return per page,
            ranging between 1 and 100.
          required: false
          schema:
            type: integer
            nullable: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentCallBatchesResponse'
      security:
        - APIKeyAuth: []
  /agents/calls/batches/{batch_id}:
    get:
      tags:
        - Agents
      summary: Get Call Batch
      description: Retrieves a batch and the current status of each of its recipients.
      operationId: agents_get-call-batch
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: batch_id
          in: path
          description: The ID of the batch.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The batch, including its recipients.
