          in: query
          description: Filter by assigned agent ID.
          required: false
          schema:
            type: string
        - name: provider_id
          in: query
          description: Filter by provider ID.
          required: false
          schema:
            type: string
        - name: type
          in: query
          description: Filter by provider type.
          required: false
          schema:
            type: string
            enum:
              - twilio
              - cartesia
              - sip_trunk
        - name: q
          in: query
          description: Search by phone number, label, or agent name.
          required: false
          schema:
            type: string
        - name: starting_after
          in: query
          description: >-
            A cursor to use in pagination. `starting_after` is a phone number ID
            that defines your place in the list. For example, if you make a
            `/agents/phone-numbers` request and receive 20 objects, ending with
            `pn_abc123`, your subsequent call can include
            `starting_after=pn_abc123` to fetch the next page of the list.
          required: false
          schema:
            type: string
            nullable: true
        - name: ending_before
          in: query
          description: >-
            A cursor to use in pagination. `ending_before` is a phone number ID
            that defines your place in the list. For example, if you make a
            `/agents/phone-numbers` request and receive 20 objects, starting
            with `pn_abc123`, your subsequent call can include
            `ending_before=pn_abc123` to fetch the previous page of the list.
          required: false
          schema:
            type: string
            nullable: true
        - name: limit
          in: query
          description: >-
            (Pagination option) The number of phone numbers to return per page,
            ranging between 1 and 100. The default page limit is 10.
          required: false
          schema:
            type: integer
            nullable: true
      responses:
        '200':
          description: A paginated list of phone numbers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhoneNumberResponse'
                  has_more:
                    type: boolean
                required:
                  - data
                  - has_more
      security:
        - APIKeyAuth: []
      x-codeSamples:
        - lang: curl
          label: Search by query
          source: |
            curl -G "https://api.cartesia.ai/agents/phone-numbers" \
              -H "Authorization: Bearer $CARTESIA_API_KEY" \
              -H "Cartesia-Version: 2026-08-14" \
              -d q="support" \
              -d limit=10
    post:
      tags:
        - Phone Numbers
      summary: Import Phone Number
      operationId: phone_numbers_import
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPhoneNumberBody'
      responses:
        '201':
          description: Phone number imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberResponse'
        '400':
          description: >-
            Import failed. Possible reasons: phone number not found in the
            provider account, provider lookup failed, provider credentials
            incomplete, webhook configuration failed (number imported but agent
            not assigned — retry via PATCH), or unsupported provider type.
        '404':
          description: Provider or agent not found.
        '409':
          description: Phone number has already been imported.
      security:
        - APIKeyAuth: []
  /agents/phone-numbers/{id}:
