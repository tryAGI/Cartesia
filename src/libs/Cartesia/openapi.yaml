openapi: 3.0.1
info:
  title: Cartesia API
  version: 0.0.1
servers:
  - url: https://api.cartesia.ai
    description: Production
security: []
paths:
  /:
    get:
      tags:
        - ApiStatus
      summary: API Status and Version
      operationId: apiStatus_get
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIInfo'
  /tts/bytes:
    post:
      tags:
        - Tts
      summary: Text-to-Speech (Bytes)
      description: Stream audio from a complete transcript
      operationId: tts_bytes
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSRequest'
      responses:
        '200':
          description: Audio bytes
          content:
            audio/*:
              schema:
                type: string
                format: binary
      security:
        - APIKeyAuth: []
        - AccessTokenAuth: []
  /tts/sse:
    post:
      tags:
        - Tts
      summary: Text-to-Speech (SSE)
      description: Stream audio with extra metadata from a complete transcript
      operationId: tts_sse
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSSSERequest'
      responses:
        '200':
          description: >-
            Server-sent events stream. Each frame is `data: <json>\n\n` where
            the JSON payload matches `TTSSSEEvent`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TTSSSEEvent'
      security:
        - APIKeyAuth: []
        - AccessTokenAuth: []
  /stt:
    post:
      tags:
        - Stt
      summary: Batch Speech-to-Text
      description: Transcribes an audio file of any length
      operationId: stt_transcribe
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: encoding
          in: query
          description: >-
            Required when uploading raw PCM data without a container header.

            If not specified, the audio file will be decoded automatically from
            its container (e.g. WAV, MP3, FLAC).
          required: false
          schema:
            $ref: '#/components/schemas/STTEncoding'
            nullable: true
        - name: sample_rate
          in: query
          description: 'The sample rate of the audio in Hz. '
          required: false
          schema:
            type: integer
            nullable: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    There's no need to break up your audio file. Long files are
                    intelligently chunked by our server.


                    Supported audio formats: `flac`, `m4a`, `mp3`, `mp4`,
                    `mpeg`, `mpga`, `oga`, `ogg`, `wav`, `webm`
                model:
                  type: string
                  enum:
                    - ink-whisper
                  example: ink-whisper
                  x-default: ink-whisper
                  description: >-
                    ID of the model to use for transcription. Must be in the
                    `ink-whisper` family of models.
                language:
                  description: The language of the input audio in ISO-639-1 format
                  default: en
                  enum:
                    - en
                    - zh
                    - de
                    - es
                    - ru
                    - ko
                    - fr
                    - ja
                    - pt
                    - tr
                    - pl
                    - ca
                    - nl
                    - ar
                    - sv
                    - it
                    - id
                    - hi
                    - fi
                    - vi
                    - he
                    - uk
                    - el
                    - ms
                    - cs
                    - ro
                    - da
                    - hu
                    - ta
                    - 'no'
                    - th
                    - ur
                    - hr
                    - bg
                    - lt
                    - la
                    - mi
                    - ml
                    - cy
                    - sk
                    - te
                    - fa
                    - lv
                    - bn
                    - sr
                    - az
                    - sl
                    - kn
                    - et
                    - mk
                    - br
                    - eu
                    - is
                    - hy
                    - ne
                    - mn
                    - bs
                    - kk
                    - sq
                    - sw
                    - gl
                    - mr
                    - pa
                    - si
                    - km
                    - sn
                    - yo
                    - so
                    - af
                    - oc
                    - ka
                    - be
                    - tg
                    - sd
                    - gu
                    - am
                    - yi
                    - lo
                    - uz
                    - fo
                    - ht
                    - ps
                    - tk
                    - nn
                    - mt
                    - sa
                    - lb
                    - my
                    - bo
                    - tl
                    - mg
                    - as
                    - tt
                    - haw
                    - ln
                    - ha
                    - ba
                    - jw
                    - su
                    - yue
                  type: string
                timestamp_granularities[]:
                  type: array
                  items:
                    $ref: '#/components/schemas/TimestampGranularity'
              required:
                - file
                - model
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
      security:
        - APIKeyAuth: []
        - AccessTokenAuth: []
  /v1/agents:
    post:
      tags:
        - Agents
      summary: Create an agent
      description: Creates an agent and its initial configuration version
      operationId: postV1Agents
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedAgentV1Request'
      responses:
        '201':
          description: Create an agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAgentV1'
      security:
        - APIKeyAuth: []
    get:
      tags:
        - Agents
      summary: List agents
      description: >-
        Returns agent summaries for your account. Full configurations are
        omitted.
      operationId: getV1Agents
      parameters:
        - name: starting_after
          in: query
          schema:
            description: >-
              A cursor for pagination. Pass the ID of the last item from the
              previous page to fetch the next page.
            type: string
        - name: ending_before
          in: query
          schema:
            description: >-
              A cursor for pagination. Pass the ID of the first item from the
              previous page to fetch the previous page.
            type: string
        - name: limit
          in: query
          schema:
            description: The maximum number of items to return, ranging between 1 and 100.
            type: integer
            default: 10
            maximum: 100
            minimum: 1
        - name: q
          in: query
          schema:
            description: Search agents by name or description.
            type: string
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      responses:
        '200':
          description: List agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListManagedAgentsV1Response'
      security:
        - APIKeyAuth: []
  /v1/agents/{agent_id}:
    get:
      tags:
        - Agents
      summary: Get an agent
      description: Returns the published agent with its complete normalized configuration
      operationId: getV1AgentsByAgent_id
      parameters:
        - name: agent_id
          in: path
          description: Unique identifier for the agent.
          required: true
          schema:
            description: Unique identifier for the agent.
            type: string
            minLength: 1
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      responses:
        '200':
          description: Get an agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAgentV1'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
      security:
        - APIKeyAuth: []
    patch:
      tags:
        - Agents
      summary: Update an agent
      description: >-
        Sparsely updates agent metadata or configuration. Configuration changes
        create a new immutable version.
      operationId: patchV1AgentsByAgent_id
      parameters:
        - name: agent_id
          in: path
          description: Unique identifier for the agent.
          required: true
          schema:
            description: Unique identifier for the agent.
            type: string
            minLength: 1
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagedAgentV1Request'
      responses:
        '200':
          description: Update an agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAgentV1'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
      security:
        - APIKeyAuth: []
    delete:
      tags:
        - Agents
      summary: Delete an agent
      description: Deletes the agent. Future reads and new calls fail.
      operationId: deleteV1AgentsByAgent_id
      parameters:
        - name: agent_id
          in: path
          description: Unique identifier for the agent.
          required: true
          schema:
            description: Unique identifier for the agent.
            type: string
            minLength: 1
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      responses:
        '204':
          description: Delete an agent
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
      security:
        - APIKeyAuth: []
  /v1/agents/{agent_id}/versions:
    get:
      tags:
        - Agents
      summary: List agent versions
      description: >-
        Returns the agent's configuration history, ordered from newest to
        oldest. Each version is an immutable snapshot of the complete
        configuration.
      operationId: getV1AgentsByAgent_idVersions
      parameters:
        - name: agent_id
          in: path
          description: Unique identifier for the agent.
          required: true
          schema:
            description: Unique identifier for the agent.
            type: string
            minLength: 1
        - name: starting_after
          in: query
          schema:
            description: >-
              A cursor for pagination. Pass the ID of the last item from the
              previous page to fetch the next page.
            type: string
        - name: ending_before
          in: query
          schema:
            description: >-
              A cursor for pagination. Pass the ID of the first item from the
              previous page to fetch the previous page.
            type: string
        - name: limit
          in: query
          schema:
            description: The maximum number of items to return, ranging between 1 and 100.
            type: integer
            default: 10
            maximum: 100
            minimum: 1
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      responses:
        '200':
          description: List agent versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListManagedAgentVersionsV1Response'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
      security:
        - APIKeyAuth: []
  /v1/agents/{agent_id}/versions/{version_id}:
    get:
      tags:
        - Agents
      summary: Get an agent version
      description: >-
        Returns one immutable configuration snapshot. To restore it, pass its
        `config` to `PATCH /v1/agents/{agent_id}`. Restoring creates a new
        version and does not change existing history.
      operationId: getV1AgentsByAgent_idVersionsByVersion_id
      parameters:
        - name: agent_id
          in: path
          description: Unique identifier for the agent.
          required: true
          schema:
            description: Unique identifier for the agent.
            type: string
            minLength: 1
        - name: version_id
          in: path
          description: Unique identifier for an immutable agent configuration version.
          required: true
          schema:
            description: Unique identifier for an immutable agent configuration version.
            type: string
            minLength: 1
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      responses:
        '200':
          description: Get an agent version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedAgentVersionV1'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
      security:
        - APIKeyAuth: []
  /v1/agents/models:
    get:
      tags:
        - Agents
      summary: List agent models
      description: >-
        Returns the LLMs available for Managed Agents, including latency and
        pricing metadata
      operationId: getV1AgentsModels
      parameters:
        - name: starting_after
          in: query
          schema:
            description: >-
              A cursor for pagination. Pass the ID of the last item from the
              previous page to fetch the next page.
            type: string
        - name: ending_before
          in: query
          schema:
            description: >-
              A cursor for pagination. Pass the ID of the first item from the
              previous page to fetch the previous page.
            type: string
        - name: limit
          in: query
          schema:
            description: The maximum number of items to return, ranging between 1 and 100.
            type: integer
            default: 10
            maximum: 100
            minimum: 1
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      responses:
        '200':
          description: List agent models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListManagedAgentModelsV1Response'
      security:
        - APIKeyAuth: []
  /v1/agents/tools:
    post:
      tags:
        - Agent Tools
      summary: Create a tool
      description: Creates a shared webhook or client tool that can be attached to agents
      operationId: postV1AgentsTools
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedToolV1Request'
            examples:
              lookup_customer:
                $ref: '#/components/examples/LookupCustomerToolRequest'
      responses:
        '201':
          description: Create a tool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedToolV1'
              examples:
                lookup_customer:
                  $ref: '#/components/examples/LookupCustomerToolResponse'
      security:
        - APIKeyAuth: []
    get:
      tags:
        - Agent Tools
      summary: List tools
      description: Returns shared webhook and client tools for your account
      operationId: getV1AgentsTools
      parameters:
        - name: starting_after
          in: query
          schema:
            description: >-
              A cursor for pagination. Pass the ID of the last item from the
              previous page to fetch the next page.
            type: string
        - name: ending_before
          in: query
          schema:
            description: >-
              A cursor for pagination. Pass the ID of the first item from the
              previous page to fetch the previous page.
            type: string
        - name: limit
          in: query
          schema:
            description: The maximum number of items to return, ranging between 1 and 100.
            type: integer
            default: 10
            maximum: 100
            minimum: 1
        - name: type
          in: query
          schema:
            description: Return only tools of this type.
            type: string
            enum:
              - webhook
              - client
        - name: agent_id
          in: query
          schema:
            description: Return only tools used by this agent.
            type: string
            minLength: 1
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      responses:
        '200':
          description: List tools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListManagedToolsV1Response'
      security:
        - APIKeyAuth: []
  /v1/agents/tools/{tool_id}:
    get:
      tags:
        - Agent Tools
      summary: Get a tool
      description: >-
        Returns one shared tool. Expand `agents` to include agents that
        currently reference it.
      operationId: getV1AgentsToolsByTool_id
      parameters:
        - name: tool_id
          in: path
          description: Unique identifier for the tool.
          required: true
          schema:
            description: Unique identifier for the tool.
            type: string
            minLength: 1
        - name: expand[]
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - agents
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      responses:
        '200':
          description: Get a tool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedToolV1'
              examples:
                lookup_customer:
                  $ref: '#/components/examples/LookupCustomerToolResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
      security:
        - APIKeyAuth: []
    patch:
      tags:
        - Agent Tools
      summary: Update a tool
      description: Sparsely updates a tool.
      operationId: patchV1AgentsToolsByTool_id
      parameters:
        - name: tool_id
          in: path
          description: Unique identifier for the tool.
          required: true
          schema:
            description: Unique identifier for the tool.
            type: string
            minLength: 1
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagedToolV1Request'
            examples:
              assignments:
                $ref: '#/components/examples/UpdateCustomerAssignmentsRequest'
      responses:
        '200':
          description: Update a tool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedToolV1'
              examples:
                lookup_customer:
                  $ref: '#/components/examples/LookupCustomerToolResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
      security:
        - APIKeyAuth: []
    delete:
      tags:
        - Agent Tools
      summary: Delete a tool
      description: >-
        Deletes an unused tool. Detach the tool from current agent
        configurations first.
      operationId: deleteV1AgentsToolsByTool_id
      parameters:
        - name: tool_id
          in: path
          description: Unique identifier for the tool.
          required: true
          schema:
            description: Unique identifier for the tool.
            type: string
            minLength: 1
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      responses:
        '204':
          description: Delete a tool
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicErrorResponse'
      security:
        - APIKeyAuth: []
  /agents/calls:
    get:
      tags:
        - Agents
      summary: List Calls
      description: >-
        Lists an agent's calls, or the calls placed for one outbound call batch.
        One of `agent_id` or `batch_id` is required.
      operationId: agents_list-calls
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: agent_id
          in: query
          description: The ID of the agent. Required unless `batch_id` is supplied.
          required: false
          schema:
            type: string
            nullable: true
            example: agent_abc123
        - name: batch_id
          in: query
          description: >-
            The ID of the outbound call batch. Required unless `agent_id` is
            supplied. Returns one entry per call attempt, so a retried recipient
            appears more than once. Recipients that failed before dialing have
            no call record here and remain on [Get Call
            Batch](/api-reference/agents/call-batches/get-call-batch).
          required: false
          schema:
            type: string
            nullable: true
            example: acb_abc123
        - name: start_time_gte
          in: query
          description: >-
            Only return calls that started at or after this RFC 3339 timestamp,
            inclusive.
          required: false
          schema:
            type: string
            format: date-time
            nullable: true
        - name: start_time_lte
          in: query
          description: >-
            Only return calls that started at or before this RFC 3339 timestamp,
            inclusive.
          required: false
          schema:
            type: string
            format: date-time
            nullable: true
        - name: expand
          in: query
          description: >-
            The fields to expand in the response. Currently, the only supported
            value is `transcript`.
          required: false
          schema:
            type: string
            nullable: true
        - name: starting_after
          in: query
          description: (Pagination option)The ID of the call to start after.
          required: false
          schema:
            type: string
            nullable: true
        - name: ending_before
          in: query
          description: (Pagination option) The ID of the call to end before.
          required: false
          schema:
            type: string
            nullable: true
        - name: limit
          in: query
          description: >-
            (Pagination option) The number of calls to return per page, ranging
            between 1 and 100.
          required: false
          schema:
            type: integer
            nullable: true
          example: 10
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCallsResponse'
        '400':
          description: >-
            Neither `agent_id` nor `batch_id` was supplied, an `agent_id` that
            does not match the batch's agent, an invalid pagination option, or a
            `start_time_gte` / `start_time_lte` bound that is malformed or
            reversed.
        '404':
          description: Agent or batch not found.
      security:
        - APIKeyAuth: []
    post:
      tags:
        - Agents
      summary: Create Outbound Call
      operationId: agents_create-outbound-call
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentOutboundCallRequest'
      responses:
        '200':
          description: >-
            Results for each destination. Check `calls[].error` for failed
            calls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOutboundCallResponse'
        '400':
          description: >-
            Invalid request or call settings. Per-destination errors are
            returned in the HTTP 200 response.
        '403':
          description: >-
            The phone number does not belong to the same organization as the
            agent.
        '404':
          description: Agent, phone number, or deployment not found.
        '500':
          description: >-
            Outbound calling is temporarily unavailable, or provider setup
            failed.
      security:
        - APIKeyAuth: []
  /agents/calls/{call_id}:
    get:
      tags:
        - Agents
      summary: Get Call
      operationId: agents_get-call
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: call_id
          in: path
          description: The ID of the call.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCall'
      security:
        - APIKeyAuth: []
    delete:
      tags:
        - Agents
      summary: Delete Call
      description: >-
        Deletes the sensitive data for a call, including the transcript, audio
        recordings, and logs. The call record is retained with non-sensitive
        operational metadata; deleted fields are omitted from subsequent API
        responses, and `redacted_at` marks when deletion occurred. Deletion
        cannot be undone.


        Only completed or failed calls can be deleted. Cancel an active call
        first via `POST /agents/calls/{call_id}/cancel`.
      operationId: agents_delete-call
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: call_id
          in: path
          description: The ID of the call.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The call record with sensitive fields deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCall'
              example:
                id: ac_abc123
                agent_id: agent_abc123
                agent_name: Customer support
                redacted_at: '2026-03-01T12:30:00Z'
                start_time: '2026-03-01T12:00:00Z'
                end_time: '2026-03-01T12:05:00Z'
                telephony_params:
                  call_sid: sid_abc123
                  connection_type: websocket
                status: completed
                end_reason: agent_hangup
        '400':
          description: >-
            Call is not in a terminal state. Only completed or failed calls can
            be deleted; cancel an active call first via `POST
            /agents/calls/{call_id}/cancel`.
        '404':
          description: Call not found.
        '500':
          description: >-
            Deletion did not complete. Retry the request; deletion is
            idempotent.
      security:
        - APIKeyAuth: []
  /agents/calls/{call_id}/cancel:
    post:
      tags:
        - Agents
      summary: Cancel Call
      description: >-
        Terminates an active call. Only calls in the `started` status can be
        cancelled; the call ends with end reason `api_cancelled`.


        Cancelling ends the call but does not delete its data. To delete a
        call's sensitive data after it ends, use `DELETE
        /agents/calls/{call_id}`.
      operationId: agents_cancel-call
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: call_id
          in: path
          description: The ID of the call.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The call was cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
                    description: Always `true` when the cancel is confirmed.
                required:
                  - cancelled
        '400':
          description: The call is not currently active and cannot be cancelled.
        '404':
          description: Call not found, or no active connection was found for the call.
        '502':
          description: The cancel request could not be delivered. Retry the request.
      security:
        - APIKeyAuth: []
