        tts_language:
          type: string
          nullable: true
          description: The language to use for text-to-speech.
    Deployment:
      title: Deployment
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the deployment.
        agent_id:
          type: string
          description: The ID of the agent associated with this deployment.
        status:
          type: string
          description: >-
            The current status of the deployment. It can be `queued`, `inactive`, `deploy_error`, `skipped`,
            `build_error`, `building`, or `deployed`.
        is_pinned:
          type: boolean
          description: >-
            Marks that this deployment is the active deployment for its associated `agent_id`. Only one
            deployment per agent can be pinned at a time. Deployments can be pinned even if they are not live
            or failed.
        is_live:
          type: boolean
          description: >-
            True if this deployment is the live production deployment for its associated `agent_id`. Only one
            deployment per agent can be live at a time.
        env_var_collection_id:
          type: string
          description: The ID of the environment variable collection associated with this deployment.
        source_code_file_id:
          type: string
          description: The ID of the source code file associated with this deployment.
        git_commit_hash:
          type: string
          description: The commit hash of the Git repository for this deployment.
        created_at:
          type: string
          format: date-time
          description: The UTC timestamp when the deployment was created.
        updated_at:
          type: string
          format: date-time
          description: The UTC timestamp when the deployment was last updated.
        build_completed_at:
          type: string
          format: date-time
          description: The UTC timestamp when the build was completed.
        build_error:
          type: string
          nullable: true
          description: Any error that occurred during the build process.
        build_logs:
          type: string
          description: Logs generated during the build process of the deployment.
        build_started_at:
          type: string
          format: date-time
          description: The UTC timestamp when the build process started.
        deployment_started_at:
          type: string
          format: date-time
          description: The UTC timestamp when the deployment process started.
        deployment_completed_at:
          type: string
          format: date-time
          description: The UTC timestamp when the deployment process was completed.
        deployment_error:
          type: string
          nullable: true
          description: Any error that occurred during the deployment process.
      required:
        - id
        - agent_id
        - status
        - is_pinned
        - is_live
        - env_var_collection_id
        - source_code_file_id
        - git_commit_hash
        - created_at
        - updated_at
        - build_completed_at
        - build_logs
        - build_started_at
        - deployment_started_at
        - deployment_completed_at
    S3UploadParamsResponse:
      title: S3UploadParamsResponse
      type: object
      description: Parameters for direct upload to S3 storage
      properties:
        url:
          type: string
          description: Pre-signed URL for upload
        method:
          type: string
          description: HTTP method to use for upload
        fields:
          type: object
          additionalProperties:
            type: string
          description: Additional fields required for the upload
      required:
        - url
        - method
        - fields
    FlushDoneMessage:
      title: FlushDoneMessage
      type: object
      description: >-
        Acknowledgment message sent in response to a `finalize` command, indicating that all buffered audio
        has been flushed and processed.
      properties:
        request_id:
          type: string
          description: Unique identifier for this transcription session.
      required:
        - request_id
    DoneMessage:
      title: DoneMessage
      type: object
      description: >-
        Acknowledgment message sent in response to a `done` command, indicating that the session is complete
        and the WebSocket will close.
      properties:
        request_id:
          type: string
          description: Unique identifier for this transcription session.
      required:
        - request_id
    ErrorMessage:
      title: ErrorMessage
      type: object
      properties:
        request_id:
          type: string
          nullable: true
          description: The request ID associated with the error, if applicable.
        message:
          type: string
          description: Human-readable error message describing what went wrong.
      required:
        - message
    STTBatchModel:
      title: STTBatchModel
      type: string
      enum:
        - ink-whisper
        - ink-whisper-2025-06-04
      description: |-
        Models that support batch speech-to-text transcription.
        See [the docs](https://docs.cartesia.ai/api-reference/stt/transcribe#body-model) for all options.
    STTAutoFinalizeModel:
      title: STTAutoFinalizeModel
      type: string
      enum:
        - ink-2
      description: |-
        Models that support realtime speech-to-text (auto finalize).
        This mode detects when the user is speaking and emits turn events.
        See [the docs](https://docs.cartesia.ai/build-with-cartesia/stt-models/latest) for all options.
    STTManualFinalizeModel:
      title: STTManualFinalizeModel
      type: string
      enum:
        - ink-2
        - ink-whisper
        - ink-whisper-2025-06-04
      description: |-
        Models that support realtime speech-to-text (manual finalize).
        This mode expects you to send the `finalize` command to trigger transcription.
        See [the docs](https://docs.cartesia.ai/build-with-cartesia/stt-models/latest) for all options.
    TTSModel:
      title: TTSModel
      type: string
      enum:
        - sonic-3.5
        - sonic-3
        - sonic-3.5-2026-05-04
        - sonic-3-2026-01-12
        - sonic-3-2025-10-27
        - 'sonic-preview'
        - 'sonic-3.6'
        - 'sonic-3.6-2026-08-27'
      description: >-
        Text-to-speech models. See [the docs](https://docs.cartesia.ai/build-with-cartesia/tts-models/latest)
        for all options.
    InfillModel:
      title: InfillModel
      type: string
      enum:
        - sonic-3
        - sonic-3-2026-01-12
        - sonic-3-2025-10-27
      description: >-
        Infill models. See [the docs](https://docs.cartesia.ai/api-reference/infill/bytes#body-model-id) for
        all options.
    FineTuneBaseModel:
      title: FineTuneBaseModel
      type: string
      enum:
        - sonic-3-2026-01-12
      description: >-
        Base model for a fine-tune. See [the
        docs](https://docs.cartesia.ai/api-reference/fine-tunes/create#body-model-id) for all options.
    RequestID:
      title: RequestID
      type: string
      description: A unique identifier for the network connection.
    ContextID:
      title: ContextID
      type: string
      description: A unique identifier for the context. You can use any unique identifier, like a UUID or human ID.
    FlushID:
      title: FlushID
      type: integer
      description: >-
        An identifier corresponding to the number of flush commands that have been sent for this context.
        Starts at 1.


        This can be used to map chunks of audio to certain transcript submissions.
    ModelSpeed:
      title: ModelSpeed
      deprecated: true
      type: string
      default: normal
      enum:
        - slow
        - normal
        - fast
      description: |-
        Speed setting for the model. Defaults to `normal`.
        This feature is experimental and may not work for all voices.
        Influences the speed of the generated speech. Faster speeds may reduce hallucination rate.
      x-stainless-deprecation-message: Use `generation_config.speed` for sonic-3.
    TTSWebSocketResponse:
      title: TTSWebSocketResponse
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - chunk
            context_id:
              $ref: '#/components/schemas/ContextID'
            status_code:
              type: integer
              description: HTTP-style status code
            done:
              type: boolean
              description: Whether this is the final chunk for this context
            data:
              type: string
              description: Base64-encoded audio data
            step_time:
              type: number
              format: double
              description: Server-side processing time for this chunk in milliseconds
            flush_id:
              $ref: '#/components/schemas/FlushID'
              nullable: true
          required:
            - type
            - context_id
            - status_code
            - done
            - data
            - step_time
        - type: object
          properties:
            type:
              type: string
              enum:
                - flush_done
            context_id:
              $ref: '#/components/schemas/ContextID'
            status_code:
              type: integer
              description: HTTP-style status code
            done:
              type: boolean
              description: Whether generation is complete
            flush_id:
              $ref: '#/components/schemas/FlushID'
            flush_done:
              type: boolean
              description: Whether the flush is complete
          required:
            - type
            - context_id
            - status_code
            - done
            - flush_id
            - flush_done
        - type: object
          properties:
            type:
              type: string
              enum:
                - done
            context_id:
              $ref: '#/components/schemas/ContextID'
            status_code:
              type: integer
              description: HTTP-style status code
            done:
              type: boolean
              enum:
                - true
              description: Whether generation is complete. Always `true` for done events.
          required:
            - type
            - context_id
            - status_code
            - done
        - type: object
          properties:
            type:
              type: string
              enum:
                - timestamps
            context_id:
              $ref: '#/components/schemas/ContextID'
            status_code:
              type: integer
              description: HTTP-style status code
            done:
              type: boolean
              description: Whether generation is complete
            word_timestamps:
              $ref: '#/components/schemas/WordTimestamps'
              nullable: true
            flush_id:
              $ref: '#/components/schemas/FlushID'
              nullable: true
          required:
            - type
            - context_id
            - status_code
            - done
        - type: object
          properties:
            type:
              type: string
              enum:
                - error
            done:
              type: boolean
              description: Whether generation is complete
            title:
              type: string
              description: Human-readable error title.
            message:
              type: string
              description: Human-readable error message.
            error_code:
              type: string
              description: Machine-readable error code.
            status_code:
              type: integer
              description: An HTTP response status code.
            doc_url:
              type: string
              description: URL to relevant documentation
            request_id:
              $ref: '#/components/schemas/RequestID'
            context_id:
              $ref: '#/components/schemas/ContextID'
          required:
            - type
            - done
        - type: object
          properties:
            type:
              type: string
              enum:
                - phoneme_timestamps
            context_id:
              $ref: '#/components/schemas/ContextID'
            status_code:
              type: integer
              description: HTTP-style status code
            done:
              type: boolean
              description: Whether generation is complete
            phoneme_timestamps:
              $ref: '#/components/schemas/PhonemeTimestamps'
              nullable: true
            flush_id:
              $ref: '#/components/schemas/FlushID'
              nullable: true
          required:
            - type
            - context_id
            - status_code
            - done
      discriminator:
        propertyName: type
    WordTimestamps:
      title: WordTimestamps
      type: object
      description: Word-level timing information.
      properties:
        words:
          type: array
          items:
            type: string
          description: List of words in order.
        start:
          type: array
          items:
            type: number
          description: Start times in seconds for each word.
        end:
          type: array
          items:
            type: number
          description: End times in seconds for each word.
      required:
        - words
        - start
        - end
      word_timestamps:
        words:
          - Hello
          - world
        start:
          - 0
          - 0.5
        end:
          - 0.4
          - 0.9
    PhonemeTimestamps:
      title: PhonemeTimestamps
      type: object
      description: Phoneme-level timing information.
      properties:
        phonemes:
          type: array
          items:
            type: string
          description: List of phonemes in order.
        start:
          type: array
          items:
            type: number
          description: Start times in seconds for each phoneme.
        end:
          type: array
          items:
            type: number
          description: End times in seconds for each phoneme.
      required:
        - phonemes
        - start
        - end
      example:
        phonemes:
          - h
          - ə
          - l
          - oʊ
        start:
          - 0.093
          - 0.174
          - 0.255
          - 0.337
        end:
          - 0.174
          - 0.255
          - 0.337
          - 0.418
    STTAutoFinalizeWebSocketQueryParams:
      type: object
      required:
        - model
        - encoding
        - sample_rate
      properties:
        model:
          $ref: '#/components/schemas/STTAutoFinalizeModel'
        encoding:
          $ref: '#/components/schemas/STTEncoding'
        sample_rate:
          type: integer
          description: Sample rate in Hz.
        keyterm:
          type: array
          maxItems: 100
          items:
            type: string
          description: >-
            Key terms to improve the recall of specific words and phrases. Each value is sent as a repeated
            `keyterm` query parameter. Pass up to 100 keyterms totaling 1200 characters. To boost one
            multi-word phrase, keep the words in a single value.


            See [Keyterm prompting](https://docs.cartesia.ai/use-the-api/stt/keyterms) for details.
    STTAutoFinalizeCloseCommand:
      title: STTAutoFinalizeCloseCommand
      type: object
      description: >-
        Sent as a JSON-encoded WebSocket text frame to close the session cleanly. All buffered audio will be
        processed by the model into events before the connection closes.
      properties:
        type:
          type: string
          enum:
            - close
          description: Command type. Send this as a JSON-encoded WebSocket text frame to close the session.
      required:
        - type
    STTAutoFinalizeWebSocketRequest:
      title: STTAutoFinalizeWebSocketRequest
      description: |-
        Text messages sent from the client to the server.
        Audio data is sent as raw binary messages rather than text messages.
      oneOf:
        - $ref: '#/components/schemas/STTAutoFinalizeCloseCommand'
    STTAutoFinalizeConnected:
      title: STTAutoFinalizeConnected
      type: object
      description: >-
        Fires once when the WebSocket connection is established. You do not need to wait for this event before
        sending audio.
      properties:
        type:
          type: string
          enum:
            - connected
          description: Event type identifier.
        request_id:
          type: string
          description: Unique identifier for this connection.
      required:
        - type
        - request_id
      example:
        type: connected
        request_id: 2ff8af53-4d38-479d-8287-58940f01c701
    STTAutoFinalizeTurnStart:
      title: STTAutoFinalizeTurnStart
      type: object
      description: >-
        Marks the start of a user turn. Fires quickly after the user begins speaking. This event can be used
        to interrupt your agent to avoid talking over the user.
      properties:
        type:
          type: string
          enum:
            - turn.start
          description: Event type identifier.
        request_id:
          type: string
          description: Unique identifier for this connection. Does not change between turns.
      required:
        - type
        - request_id
      example:
        type: turn.start
        request_id: 2ff8af53-4d38-479d-8287-58940f01c701
    STTAutoFinalizeTurnUpdate:
      title: STTAutoFinalizeTurnUpdate
      type: object
      description: Fires repeatedly as the model transcribes the current user turn.
      properties:
        type:
          type: string
          enum:
            - turn.update
          description: Event type identifier.
        transcript:
          type: string
          description: >-
            Cumulative text for the current turn, i.e. the full text transcribed so far in this turn, not a
            delta.
        request_id:
          type: string
          description: Unique identifier for this connection. Does not change between turns.
      required:
        - type
        - transcript
        - request_id
      example:
        type: turn.update
        transcript: Hey can you help
        request_id: 2ff8af53-4d38-479d-8287-58940f01c701
    STTAutoFinalizeTurnEagerEnd:
      title: STTAutoFinalizeTurnEagerEnd
      type: object
      description: '[PREVIEW] Fires when the model predicts that the user might be done speaking.'
      properties:
        type:
          type: string
          enum:
            - turn.eager_end
          description: Event type identifier.
        transcript:
          type: string
          description: Cumulative text for the current turn.
        request_id:
          type: string
          description: Unique identifier for this connection. Does not change between turns.
      required:
        - type
        - transcript
        - request_id
      example:
        type: turn.eager_end
        transcript: Hey can you help me with something?
        request_id: 2ff8af53-4d38-479d-8287-58940f01c701
    STTAutoFinalizeTurnResume:
      title: STTAutoFinalizeTurnResume
      type: object
      description: '[PREVIEW] Fires after `turn.eager_end` if the user turn has not actually ended.'
      properties:
        type:
          type: string
          enum:
            - turn.resume
          description: Event type identifier.
        request_id:
          type: string
          description: Unique identifier for this connection. Does not change between turns.
      required:
        - type
        - request_id
      example:
        type: turn.resume
        request_id: 2ff8af53-4d38-479d-8287-58940f01c701
    STTAutoFinalizeTurnEnd:
      title: STTAutoFinalizeTurnEnd
      type: object
      description: Marks the end of a user turn.
      properties:
        type:
          type: string
          enum:
            - turn.end
          description: Event type identifier.
        transcript:
          type: string
          description: Definitive transcript for the completed turn.
        request_id:
          type: string
          description: Unique identifier for this connection. Does not change between turns.
      required:
        - type
        - transcript
        - request_id
      example:
        type: turn.end
        transcript: Hey can you help me with something?
        request_id: 2ff8af53-4d38-479d-8287-58940f01c701
    STTErrorResponse:
      title: STTErrorResponse
      type: object
      description: Error information for STT WebSocket connections.
      properties:
        type:
          type: string
          enum:
            - error
          description: Event type identifier.
        error_code:
          type: string
          description: Machine-readable error code.
        status_code:
          type: integer
          description: An HTTP response status code.
        title:
          type: string
          description: Human-readable error title.
        message:
          type: string
          description: Human-readable error message.
        doc_url:
          type: string
          description: URL to relevant documentation.
        request_id:
          type: string
          description: Unique identifier for this WebSocket connection.
      required:
        - type
      example:
        type: error
        title: Invalid model
        message: The model is not valid, make sure it is a valid model ID.
        error_code: model_not_found
        doc_url: https://docs.cartesia.ai/build-with-cartesia/stt-models/latest
        status_code: 400
        request_id: 2ff8af53-4d38-479d-8287-58940f01c701
    STTAutoFinalizeWebSocketResponse:
      title: STTAutoFinalizeWebSocketResponse
      description: >-
        Events emitted by the server. Each event has a `type` field that discriminates between message
        variants. All emitted text is final — the model does not revise previous output. The `transcript`
        field is cumulative within a turn.
      oneOf:
        - $ref: '#/components/schemas/STTAutoFinalizeConnected'
        - $ref: '#/components/schemas/STTAutoFinalizeTurnStart'
        - $ref: '#/components/schemas/STTAutoFinalizeTurnUpdate'
        - $ref: '#/components/schemas/STTAutoFinalizeTurnEagerEnd'
        - $ref: '#/components/schemas/STTAutoFinalizeTurnResume'
        - $ref: '#/components/schemas/STTAutoFinalizeTurnEnd'
        - $ref: '#/components/schemas/STTErrorResponse'
      discriminator:
        propertyName: type
    STTManualFinalizeWebSocketQueryParams:
      type: object
      required:
        - model
        - encoding
        - sample_rate
      properties:
        model:
          $ref: '#/components/schemas/STTManualFinalizeModel'
        encoding:
          $ref: '#/components/schemas/STTEncoding'
        sample_rate:
          type: integer
          description: Sample rate in Hz.
        language:
          type: string
          enum:
            - en
          description: >-
            The language of the input audio in ISO-639-1 format. Defaults to `en`.

            See [the docs](https://docs.cartesia.ai/build-with-cartesia/stt-models/latest) for current
            language support.
        min_volume:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Used by `ink-whisper` models only. Controls what is considered silence for automatic transcript
            finalization. Lower values pick up quiet audio; higher values filter noisy audio more
            aggressively.
        max_silence_duration_secs:
          type: number
          description: >-
            Used by `ink-whisper` models only. Maximum duration of silence (in seconds) before the API
            automatically finalizes the transcript. Lower values finalize more aggressively; higher values
            allow longer pauses within utterances.
        keyterm:
          type: array
          maxItems: 100
          items:
            type: string
          description: >-
            Used by `ink-2` models only. Key terms to improve the recall of specific words and phrases. Each
            value is sent as a repeated `keyterm` query parameter. Pass up to 100 keyterms totaling 1200
            characters. To boost one multi-word phrase, keep the words in a single value.


            See [Keyterm prompting](https://docs.cartesia.ai/use-the-api/stt/keyterms) for details.
    STTManualFinalizeWebSocketRequest:
      title: STTManualFinalizeWebSocketRequest
      description: >-
        Text commands sent to the server:

        - Send ``finalize`` as a text message when the user is done speaking to receive the transcript for any
        buffered audio

        - Send ``close`` as a text message to flush remaining audio, close session, and receive a done
        acknowledgment


        Audio data is sent as raw binary messages.
      type: string
      enum:
        - finalize
        - close
    STTManualFinalizeTranscriptResponse:
      title: STTManualFinalizeTranscriptResponse
      type: object
      description: A transcript chunk.
      properties:
        type:
          type: string
          enum:
            - transcript
          description: Event type identifier.
        request_id:
          type: string
          description: Unique identifier for this WebSocket connection.
        text:
          type: string
          description: >-
            Transcribed text. This is a delta from the last transcript chunk with `"is_final": true`.

            To assemble the full transcript, concatenate all transcript chunks where `"is_final": true`.

            Do not strip whitespace from `text` or add whitespace between chunks as this will produce an
            incorrect transcript.
        is_final:
          type: boolean
          description: Whether `text` is finalized.
        duration:
          type: number
          description: Duration of the audio that produced this chunk, in seconds.
        language:
          type: string
          description: Detected language of the audio in ISO-639-1 format.
        words:
          type: array
          description: Word-level timing information for the transcript.
          items:
            $ref: '#/components/schemas/WordTimestamps'
      required:
        - type
        - request_id
        - text
        - is_final
      example:
        type: transcript
        is_final: true
        request_id: b67e1c5d-2f4c-4c3d-9f82-96eb4d2f12a8
        text: How are you doing today?
        duration: 2.5
        language: en
        words:
          - word: How
            start: 0
            end: 0.12
          - word: are
            start: 0.15
            end: 0.25
          - word: you
            start: 0.28
            end: 0.35
          - word: doing
            start: 0.38
            end: 0.55
          - word: today?
            start: 0.58
            end: 0.78
    STTManualFinalizeFlushDoneResponse:
      title: STTManualFinalizeFlushDoneResponse
      type: object
      description: Acknowledgment that buffered audio has been processed in response to a `finalize` command.
      properties:
        type:
          type: string
          enum:
            - flush_done
          description: Event type identifier.
        request_id:
          type: string
          description: Unique identifier for this WebSocket connection.
      required:
        - type
        - request_id
      example:
        type: flush_done
        request_id: b67e1c5d-2f4c-4c3d-9f82-96eb4d2f12a8
    STTManualFinalizeDoneResponse:
      title: STTManualFinalizeDoneResponse
      type: object
      description: >-
        Acknowledgment for the `close` command, sent after all buffered audio has been processed and before
        the connection closes.
      properties:
        type:
          type: string
          enum:
            - done
          description: Event type identifier.
        request_id:
          type: string
          description: Unique identifier for this WebSocket connection.
      required:
        - type
        - request_id
      example:
        type: done
        request_id: b67e1c5d-2f4c-4c3d-9f82-96eb4d2f12a8
    STTManualFinalizeWebSocketResponse:
      title: STTManualFinalizeWebSocketResponse
      description: >-
        Events emitted by the server. Each event has a `type` field that discriminates between message
        variants.
      oneOf:
        - $ref: '#/components/schemas/STTManualFinalizeTranscriptResponse'
        - $ref: '#/components/schemas/STTManualFinalizeFlushDoneResponse'
        - $ref: '#/components/schemas/STTManualFinalizeDoneResponse'
        - $ref: '#/components/schemas/STTErrorResponse'
      discriminator:
        propertyName: type
    CancelContextRequest:
      title: CancelContextRequest
      type: object
      properties:
        context_id:
          $ref: '#/components/schemas/ContextID'
          description: The ID of the context to cancel.
        cancel:
          type: boolean
          enum:
            - true
          description: Whether to cancel the context, so that no more messages are generated for that context.
      required:
        - context_id
        - cancel
    GenerationRequest:
      title: Generation Request
      type: object
      properties:
        model_id:
          $ref: '#/components/schemas/TTSModel'
          x-stainless-naming:
            python:
              property_name: llm_model_id
        transcript:
          type: string
          description: The transcript to generate speech for.
        voice:
          $ref: '#/components/schemas/TTSRequestVoiceSpecifier'
        generation_config:
          $ref: '#/components/schemas/GenerationConfig'
        language:
          $ref: '#/components/schemas/SupportedLanguage'
        output_format:
          $ref: '#/components/schemas/RawOutputFormat'
        context_id:
          $ref: '#/components/schemas/ContextID'
        continue:
          type: boolean
          nullable: true
          default: false
          description: |-
            Whether this input may be followed by more inputs.
            If not specified, this defaults to `false`.
        max_buffer_delay_ms:
          type: integer
          nullable: true
          default: 3000
          description: >-
            The maximum time in milliseconds to buffer text before starting generation. Values between [0,
            5000]ms are supported. Defaults to 3000ms.


            When set, the model will buffer incoming text chunks until it's confident it has enough context to
            generate high-quality speech, or the buffer delay elapses, whichever comes first. Without this
            option set, the model will kick off generations immediately, ceding control of buffering to the
            user.


            Use this to balance responsiveness with higher quality speech generation, which often benefits
            from having more context.
        speed:
          $ref: '#/components/schemas/ModelSpeed'
          deprecated: true
        flush:
          type: boolean
          nullable: true
          description: Whether to flush the context.
        add_timestamps:
          type: boolean
          nullable: true
          default: false
          description: >-
            Whether to return word-level timestamps. If `false` (default), no word timestamps will be produced
            at all. If `true`, the server will return timestamp events containing word-level timing
            information.
        add_phoneme_timestamps:
          type: boolean
          nullable: true
          default: false
          description: >-
            Whether to return phoneme-level timestamps. If `false` (default), no phoneme timestamps will be
            produced. If `true`, the server will return timestamp events containing phoneme-level timing
            information.
        use_normalized_timestamps:
          type: boolean
          nullable: true
          description: Whether to use normalized timestamps (True) or original timestamps (False).
        pronunciation_dict_id:
          type: string
          nullable: true
          description: >-
            The ID of a pronunciation dictionary to use for the generation. Pronunciation dictionaries are
            supported by `sonic-3` models and newer.
      required:
        - model_id
        - transcript
        - voice
        - output_format
        - context_id
    TTSWebSocketRequest:
      title: TTSWebSocketRequest
      oneOf:
        - description: Use this to generate speech for a transcript.
          $ref: '#/components/schemas/GenerationRequest'
        - description: Use this to cancel a context, so that no more messages are generated for that context.
          $ref: '#/components/schemas/CancelContextRequest'
    VoiceChangerSSEEvent:
      title: VoiceChangerSSEEvent
      description: An event emitted by the Voice Changer SSE stream.
      oneOf:
        - $ref: '#/components/schemas/VoiceChangerSSEChunk'
        - $ref: '#/components/schemas/VoiceChangerSSEDone'
        - $ref: '#/components/schemas/VoiceChangerSSEError'
    VoiceChangerSSEChunk:
      title: VoiceChangerSSEChunk
      description: Audio data chunk.
      type: object
      example:
        done: false
        status_code: 206
        step_time: 123
        data: aSDinaTvuI8gbWludGxpZnk=
        sample_rate: 44100
      properties:
        status_code:
          type: integer
          enum:
            - 206
          description: HTTP-style status code. Always `206` for chunk events.
        done:
          type: boolean
          enum:
            - false
          description: Whether this is the final event for the request. Always `false` for chunk events.
        data:
          type: string
          description: Base64-encoded audio data.
        sample_rate:
          type: integer
          description: The sample rate of the audio in Hz.
        step_time:
          type: number
          description: Server-side processing time for this chunk in milliseconds.
      required:
        - status_code
        - done
        - data
        - sample_rate
        - step_time
    VoiceChangerSSEDone:
      title: VoiceChangerSSEDone
      description: Generation completion signal. Final event in the stream.
      type: object
      example:
        done: true
        status_code: 200
      properties:
        status_code:
          type: integer
          enum:
            - 200
          description: HTTP-style status code. Always `200` for done events.
        done:
          type: boolean
          enum:
            - true
          description: Whether generation is complete. Always `true` for done events.
      required:
        - status_code
        - done
    VoiceChangerSSEError:
      title: VoiceChangerSSEError
      description: Error information for the Voice Changer SSE request.
      type: object
      example:
        type: error
        done: true
        title: Invalid voice
        message: The voice is not valid, make sure it is a valid voice ID.
        error_code: voice_not_found
        status_code: 400
        request_id: 2ff8af53-4d38-479d-8287-58940f01c701
      properties:
        type:
          type: string
          enum:
            - error
          description: Event type identifier.
        done:
          type: boolean
          enum:
            - true
          description: Whether generation is complete. Always `true` for error events.
        status_code:
          type: integer
          description: An HTTP response status code.
        title:
          type: string
          description: Human-readable error title.
        message:
          type: string
          description: Human-readable error message.
        error_code:
          type: string
          nullable: true
          description: Machine-readable error code.
        request_id:
          type: string
          description: Unique identifier for this request.
        doc_url:
          type: string
          nullable: true
          description: URL to relevant documentation.
      required:
        - type
        - done
        - status_code
        - title
        - message
        - request_id
    BaseVoiceId:
      title: BaseVoiceId
      $ref: '#/components/schemas/VoiceId'
      description: Pull in features from a base voice, used for features like voice mixing.
    VoiceLocale:
      title: VoiceLocale
      type: object
      description: >-
        One locale a voice can speak, as a BCP-47 language-region tag plus whether it is the voice's
        native/source locale.
      properties:
        locale:
          type: string
          pattern: '^[a-z]{2}-[A-Z]{2}$'
          description: The locale's BCP-47 language-region tag (for example, `en-US`).
        is_native:
          type: boolean
          description: Whether this is the voice's native/source locale.
      required:
        - locale
        - is_native
    LocalizeTargetLanguage:
      title: LocalizeTargetLanguage
      type: string
      enum:
        - en
        - de
        - es
        - fr
        - ja
        - pt
        - zh
        - hi
        - it
        - ko
        - nl
        - pl
        - ru
        - sv
        - tr
      description: >-
        Target language to localize the voice to.


        Options: English (en), German (de), Spanish (es), French (fr), Japanese (ja), Portuguese (pt), Chinese
        (zh), Hindi (hi), Italian (it), Korean (ko), Dutch (nl), Polish (pl), Russian (ru), Swedish (sv),
        Turkish (tr).
    LocalizeEnglishDialect:
      title: LocalizeEnglishDialect
      type: string
      enum:
        - au
        - in
        - so
        - uk
        - us
    LocalizeFrenchDialect:
      title: LocalizeFrenchDialect
      type: string
      enum:
        - eu
        - ca
    LocalizeSpanishDialect:
      title: LocalizeSpanishDialect
      type: string
      enum:
        - mx
        - pe
    LocalizePortugueseDialect:
      title: LocalizePortugueseDialect
      type: string
      enum:
        - br
        - eu
    LocalizeDialect:
      title: LocalizeDialect
      oneOf:
        - description: >-
            Only available when language is set to English (`en`). Options: Australian (`au`), Indian (`in`),
            Southern (`so`), British (`uk`), or American (`us`).
          $ref: '#/components/schemas/LocalizeEnglishDialect'
        - description: >-
            Only available when language is set to Spanish (`es`). Options: Latin American (`mx`) and
            Peninsular (`pe`).
          $ref: '#/components/schemas/LocalizeSpanishDialect'
        - description: >-
            Only available when language is set to Portuguese (`pt`). Options: Brazilian (`br`) and European
            Portuguese (`eu`).
          $ref: '#/components/schemas/LocalizePortugueseDialect'
        - description: >-
            Only available when language is set to French (`fr`). Options: Standard Parisian/Metropolitan
            (`eu`) and Canadian (`ca`).
          $ref: '#/components/schemas/LocalizeFrenchDialect'
      description: >-
        The dialect to localize to. Only supported for English (`en`), Spanish (`es`), Portuguese (`pt`), and
        French (`fr`).
    Gender:
      title: Gender
      type: string
      enum:
        - male
        - female
