          required: false
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApiKeysResponse'
              example:
                data:
                  - id: 00000000-0000-4000-8000-000000000001
