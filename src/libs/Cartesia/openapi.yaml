  /infill/bytes:
    post:
      tags:
        - Infill
      summary: Infill (Bytes)
      description: Generate audio that smoothly connects two existing audio segments
      operationId: infill_bytes
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                left_audio:
                  type: string
                  format: binary
                  description: >-
                    Audio clip that comes before the infill transcript:

                    `left_audio` -> `transcript` -> `right_audio`


                    For best results, target natural pauses in the audio and
                    clip tightly.

                    At least one of `left_audio` or `right_audio` must be
                    provided.


                    Supported audio formats: `flac`, `mp3`, `mpeg`, `mpga`,
                    `oga`, `ogg`, `wav`, `webm`
                right_audio:
                  type: string
                  format: binary
                  description: >-
                    Audio clip that comes after the infill transcript:

                    `left_audio` -> `transcript` -> `right_audio`


                    For best results, target natural pauses in the audio and
                    clip tightly.

                    At least one of `left_audio` or `right_audio` must be
                    provided.


                    Supported audio formats: `flac`, `mp3`, `mpeg`, `mpga`,
                    `oga`, `ogg`, `wav`, `webm`
                model_id:
                  description: The ID of the model to use for generating audio
                  type: string
                  enum:
                    - sonic-3
                    - sonic-3-2026-01-12
                language:
                  $ref: '#/components/schemas/SupportedLanguage'
                  description: The language of the transcript
                transcript:
                  description: >-
                    The infill text to generate.

                    For best results, use longer transcripts to give the model
                    more flexibility to adapt to the rest of the audio.
                  type: string
                voice_id:
                  description: The ID of the voice to use for generating audio
                  type: string
                output_format[container]:
                  $ref: '#/components/schemas/OutputFormatContainer'
                  description: The format of the output audio
                output_format[sample_rate]:
                  description: The sample rate of the output audio
                  type: integer
                  enum:
                    - 8000
                    - 16000
                    - 22050
                    - 24000
                    - 44100
                    - 48000
                output_format[encoding]:
                  $ref: '#/components/schemas/RawEncoding'
                  description: Required for `raw` and `wav` containers.
                  nullable: true
                output_format[bit_rate]:
                  description: Required for `mp3` containers.
                  type: integer
                  nullable: true
      responses:
        '200':
          description: Audio bytes
          content:
            audio/*:
              schema:
                type: string
                format: binary
      security:
        - APIKeyAuth: []
  /usage/credits:
    get:
      tags:
        - Usage
      summary: Get Credit Usage
      description: Returns your credit usage over time, bucketed by the requested interval.
      operationId: usage_credits
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: start_ts
          in: query
          description: >-
            Start of the time window, as an RFC 3339 datetime (with timezone).
            Rounded down to the start of the UTC day. `start_ts` to `end_ts`
            cannot span more than a year.
          required: false
          schema:
            type: string
            format: date-time
            nullable: true
            example: '2026-01-01T00:00:00Z'
        - name: end_ts
          in: query
          description: >-
            End of the time window, as an RFC 3339 datetime (with timezone).
            Rounded up to the start of the next UTC day, unless already at
            midnight. `start_ts` to `end_ts` cannot span more than a year.
          required: false
          schema:
            type: string
            format: date-time
            nullable: true
            example: '2026-01-03T00:00:00Z'
        - name: interval
          in: query
          description: >-
            Omit to receive a single bucket spanning from `start_ts` to
            `end_ts`. When `group_by` is set, must be `day` if provided.
          required: false
          schema:
            $ref: '#/components/schemas/UsageInterval'
            nullable: true
          example: day
        - name: api_key_id
          in: query
          description: >-
            Filter usage to a single API key. When set, only credits
            attributable to that key are returned. Can be combined with
            `group_by` for other dimensions (`capability`, `model`, `voice`),
            but not with `group_by=api_key`.
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
        - name: group_by
          in: query
          description: >-
            Break down credit usage by capability, model, voice, or API key.
            When `interval` is set it must be `day`. Cannot be combined with
            `api_key_id` when `group_by=api_key`.
          required: false
          schema:
            $ref: '#/components/schemas/UsageCreditsGroupBy'
            nullable: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageCreditsResponse'
              example:
                data:
                  - start_ts: '2026-01-01T00:00:00.000Z'
                    end_ts: '2026-01-02T00:00:00.000Z'
                    credits: 1200
                  - start_ts: '2026-01-02T00:00:00.000Z'
                    end_ts: '2026-01-03T00:00:00.000Z'
                    credits: 980
      security:
        - AdminAPIKeyAuth: []
  /usage/agents:
    get:
      tags:
        - Usage
      summary: Get Agent Usage
      description: Returns your agent usage over time, bucketed by the requested interval.
      operationId: usage_agents
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: start_ts
          in: query
          description: >-
            Start of the time window, as an RFC 3339 datetime (with timezone).
            Rounded down to the start of the UTC day. `start_ts` to `end_ts`
            cannot span more than a year.
          required: false
          schema:
            type: string
            format: date-time
            nullable: true
            example: '2026-03-01T00:00:00Z'
        - name: end_ts
          in: query
          description: >-
            End of the time window, as an RFC 3339 datetime (with timezone).
            Rounded up to the start of the next UTC day, unless already at
            midnight. `start_ts` to `end_ts` cannot span more than a year. Must
            be strictly after `start_ts`.
          required: false
          schema:
            type: string
            format: date-time
            nullable: true
            example: '2026-03-08T00:00:00Z'
        - name: interval
          in: query
          description: >-
            Omit to receive a single bucket spanning from `start_ts` to
            `end_ts`.
          required: false
          schema:
            $ref: '#/components/schemas/UsageInterval'
            nullable: true
          example: day
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageAgentsResponse'
              example:
                data:
                  - start_ts: '2026-03-01T00:00:00.000Z'
                    end_ts: '2026-03-02T00:00:00.000Z'
                    cents: 129
                    minutes: 18.23
                    calls: 33
                  - start_ts: '2026-03-02T00:00:00.000Z'
                    end_ts: '2026-03-03T00:00:00.000Z'
                    cents: 1093
                    minutes: 159.23
                    calls: 130
      security:
        - AdminAPIKeyAuth: []
