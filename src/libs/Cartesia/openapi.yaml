  /voice-changer/bytes:
    post:
      description: >-
        Voice Changer (Bytes).


        Takes an audio file of speech, and returns an audio file of speech spoken with the same intonation,
        but with a different voice.


        This endpoint is priced at 15 characters per second of input audio.
      operationId: voiceChanger_bytes
      tags:
        - VoiceChanger
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      responses:
        '200':
          description: OK
          content:
            audio/wav:
              schema:
                type: string
                format: binary
      summary: Voice Changer (Bytes)
      security: *ref_0
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                clip:
                  type: string
                  format: binary
                voice[id]:
                  type: string
                output_format[container]:
                  $ref: '#/components/schemas/OutputFormatContainer'
                output_format[sample_rate]:
                  type: integer
                  enum:
                    - 8000
                    - 16000
                    - 22050
                    - 24000
                    - 44100
                    - 48000
                output_format[encoding]:
                  description: Required for `raw` and `wav` containers.
                  $ref: '#/components/schemas/RawEncoding'
                  nullable: true
                output_format[bit_rate]:
                  description: Required for `mp3` containers.
                  type: integer
                  nullable: true
  /voice-changer/sse:
    post:
      operationId: voiceChanger_sse
      tags:
        - VoiceChanger
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
      responses:
        '200':
          description: >-
            Server-sent events stream. Each frame is `data: <json>\n\n` where the JSON payload matches
            `VoiceChangerSSEEvent`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/VoiceChangerSSEEvent'
      summary: Voice Changer (SSE)
      security: *ref_0
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                clip:
                  type: string
                  format: binary
                voice[id]:
                  type: string
                output_format[container]:
                  $ref: '#/components/schemas/OutputFormatContainer'
                output_format[sample_rate]:
                  type: integer
                  enum:
                    - 8000
                    - 16000
                    - 22050
                    - 24000
                    - 44100
                    - 48000
                output_format[encoding]:
                  description: Required for `raw` and `wav` containers.
                  $ref: '#/components/schemas/RawEncoding'
                  nullable: true
                output_format[bit_rate]:
                  description: Required for `mp3` containers.
                  type: integer
                  nullable: true
components:
  schemas:
    APIInfo:
      title: APIInfo
      type: object
      properties:
        ok:
          type: boolean
        version:
          type: string
          format: date
          description: Latest API version
          example: '2026-03-01'
      required:
        - ok
        - version
    TTSRequest:
      title: TTSRequest
      type: object
      properties:
        model_id:
          $ref: '#/components/schemas/TTSModelID'
        transcript:
          type: string
          default: Hi there, it's awesome to meet you.
        voice:
          $ref: '#/components/schemas/TTSRequestVoiceSpecifier'
        language:
          type: string
          nullable: true
          description: >-
            The transcript's language or locale (for example `en` or `en-GB`).
            `language` and `locale` accept the same values. Set one or the
            other, never both; setting both returns a 400 error. See [supported
            codes](/build-with-cartesia/capability-guides/advanced-capabilities#which-locales-are-supported).
        locale:
          type: string
          nullable: true
          description: >-
            The transcript's language or locale (for example `en` or `en-GB`).
            `locale` and `language` accept the same values. Set one or the
            other, never both; setting both returns a 400 error. See [supported
            codes](/build-with-cartesia/capability-guides/advanced-capabilities#which-locales-are-supported).
        accent:
          type: string
          nullable: true
          description: >-
            Usually unnecessary: Cartesia picks the closest accent the voice
            supports for the requested `language` or `locale`. Set it only to
            make a [multilingual
            voice](/build-with-cartesia/capability-guides/multilingual-voices)
            sound accented (e.g. speak English with a French accent). Must come
            from the voice's [Get Voice `accents`
            field](/api-reference/voices/get#response-accents). Learn more
            [here](/build-with-cartesia/capability-guides/multilingual-voices#using-a-multilingual-voice).
        normalization:
          type: string
          nullable: true
          default: auto
          description: >-
            Text normalization. `auto` (default) runs the locale-aware
            normalizer, `off` skips it, or pass a language or locale code (for
            example `en` or `en-IN`) to pin the normalizer independently of the
            generation language. See [Text
            Normalization](/build-with-cartesia/capability-guides/text-normalization).
        output_format:
          $ref: '#/components/schemas/OutputFormat'
        pronunciation_dict_id:
          type: string
          nullable: true
          description: >-
            The ID of a pronunciation dictionary to use for the generation.
            Pronunciation dictionaries are supported by `sonic-3` models and
            newer.
        generation_config:
          $ref: '#/components/schemas/GenerationConfig'
      required:
        - model_id
        - transcript
        - voice
        - output_format
    TTSModelID:
      title: TTSModelID
      type: string
      enum:
        - sonic-3.6
        - sonic-3.5
        - sonic-3
        - sonic-latest
        - 'sonic-3.6-2026-08-27'
        - 'sonic-preview'
      example: sonic-3.6
      default: sonic-3.6
      description: |-
        The ID of the model to use for the generation.
        See [Models](/build-with-cartesia/tts-models/latest) all options.
    TTSRequestVoiceSpecifier:
      title: TTSRequestVoiceSpecifier
      description: >-
        The voice to use for generation. Pass either a voice ID string or an
        object with a required `id` (additional object fields may be added in
        future API versions). Find a voice in the [Voice
        Library](https://play.cartesia.ai/voices) or via [List
        Voices](/api-reference/voices/list). Embeddings are not accepted in this
        API version.
      oneOf:
        - type: string
          title: TTSRequestVoiceId
          description: The ID of the voice.
          example: db6b0ed5-d5d3-463d-ae85-518a07d3c2b4
        - type: object
          title: TTSRequestVoiceObject
          description: >-
            Voice object. `id` is required; other fields may be added in future
            API versions.
          required:
            - id
          properties:
            id:
              type: string
              description: The ID of the voice.
              example: db6b0ed5-d5d3-463d-ae85-518a07d3c2b4
          additionalProperties: true
    OutputFormat:
      title: OutputFormat
      oneOf:
        - $ref: '#/components/schemas/WAVOutputFormat'
        - $ref: '#/components/schemas/MP3OutputFormat'
        - $ref: '#/components/schemas/RawOutputFormat'
    GenerationConfig:
      title: GenerationConfig
      type: object
      description: >-
        Configure the various attributes of the generated speech. Available on
        `sonic-3` and newer models; not available on earlier models.


        See [Volume, Speed, and
        Emotion](/build-with-cartesia/capability-guides/volume-speed-emotion)
        for a guide on this option.
      properties:
        volume:
          type: number
          format: double
          default: 1
          description: >-
            Adjust the volume of the generated speech between 0.5x and 2.0x the
            default volume. Valid values are between [0.5, 2.0] inclusive.
        speed:
          type: number
          format: double
          default: 1
          description: >-
            Adjust the speed of the generated speech between 0.6x and 1.5x the
            default speed. Valid values are between [0.6, 1.5] inclusive.
        emotion:
          $ref: '#/components/schemas/Emotion'
          description: >-
            Optional. Guide the emotion of the generated speech. If omitted, the
            model interprets the emotional subtext of the transcript.
    WAVOutputFormat:
      title: WAVOutputFormat
      type: object
      properties:
        container:
          type: string
          enum:
            - wav
          default: wav
        encoding:
          $ref: '#/components/schemas/RawEncoding'
          default: pcm_s16le
        sample_rate:
          type: integer
          enum:
            - 8000
            - 16000
            - 22050
            - 24000
            - 44100
            - 48000
          default: 44100
      required:
        - container
    MP3OutputFormat:
      title: MP3OutputFormat
      type: object
      properties:
        container:
          type: string
          enum:
            - mp3
          default: mp3
        sample_rate:
          type: integer
          enum:
            - 8000
            - 16000
            - 22050
            - 24000
            - 44100
            - 48000
        bit_rate:
          type: integer
          enum:
            - 32000
            - 64000
            - 96000
            - 128000
            - 192000
      required:
        - container
        - sample_rate
        - bit_rate
    RawOutputFormat:
      title: RawOutputFormat
      type: object
      properties:
        container:
          type: string
          enum:
            - raw
          default: raw
        encoding:
          $ref: '#/components/schemas/RawEncoding'
        sample_rate:
          type: integer
          enum:
            - 8000
            - 16000
            - 22050
            - 24000
            - 44100
            - 48000
      required:
        - container
        - encoding
        - sample_rate
    Emotion:
      title: Emotion
      type: string
      description: >-
        The primary emotions are `neutral`, `calm`, `angry`, `content`, `sad`,
        `scared`. For more options, see [Volume, Speed, and
        Emotion](/build-with-cartesia/capability-guides/volume-speed-emotion#emotion-controls-beta).
      enum:
        - neutral
        - happy
        - excited
        - enthusiastic
        - elated
        - euphoric
        - triumphant
        - amazed
        - surprised
        - flirtatious
        - curious
        - content
        - peaceful
        - serene
        - calm
        - grateful
        - affectionate
        - trust
        - sympathetic
        - anticipation
        - mysterious
        - angry
        - mad
        - outraged
        - frustrated
        - agitated
        - threatened
        - disgusted
        - contempt
        - envious
        - sarcastic
        - ironic
        - sad
        - dejected
        - melancholic
        - disappointed
        - hurt
        - guilty
        - bored
        - tired
        - rejected
        - nostalgic
        - wistful
        - apologetic
        - hesitant
        - insecure
        - confused
        - resigned
        - anxious
        - panicked
        - alarmed
        - scared
        - proud
        - confident
        - distant
        - skeptical
        - contemplative
        - determined
    RawEncoding:
      title: RawEncoding
      type: string
      description: >-
        The encoding format for output audio. See [TTS Output Audio
        Format](/build-with-cartesia/capability-guides/tts-output-audio-format)
        if you're unsure what to use.
      enum:
        - pcm_f32le
        - pcm_s16le
        - pcm_mulaw
        - pcm_alaw
    TTSSSERequest:
      title: TTSSSERequest
      type: object
      properties:
        model_id:
          $ref: '#/components/schemas/TTSModelID'
        transcript:
          type: string
          default: Hi there, it's awesome to meet you.
        voice:
          $ref: '#/components/schemas/TTSRequestVoiceSpecifier'
        output_format:
          $ref: '#/components/schemas/SSEOutputFormat'
        language:
          type: string
          nullable: true
          description: >-
            The transcript's language or locale (for example `en` or `en-GB`).
            `language` and `locale` accept the same values. Set one or the
            other, never both; setting both returns a 400 error. See [supported
            codes](/build-with-cartesia/capability-guides/advanced-capabilities#which-locales-are-supported).
        locale:
          type: string
          nullable: true
          description: >-
            The transcript's language or locale (for example `en` or `en-GB`).
            `locale` and `language` accept the same values. Set one or the
            other, never both; setting both returns a 400 error. See [supported
            codes](/build-with-cartesia/capability-guides/advanced-capabilities#which-locales-are-supported).
        accent:
          type: string
          nullable: true
          description: >-
            Usually unnecessary: Cartesia picks the closest accent the voice
            supports for the requested `language` or `locale`. Set it only to
            make a [multilingual
            voice](/build-with-cartesia/capability-guides/multilingual-voices)
            sound accented (e.g. speak English with a French accent). Must come
            from the voice's [Get Voice `accents`
            field](/api-reference/voices/get#response-accents). Learn more
            [here](/build-with-cartesia/capability-guides/multilingual-voices#using-a-multilingual-voice).
        normalization:
          type: string
          nullable: true
          default: auto
          description: >-
            Text normalization. `auto` (default) runs the locale-aware
            normalizer, `off` skips it, or pass a language or locale code (for
            example `en` or `en-IN`) to pin the normalizer independently of the
            generation language. See [Text
            Normalization](/build-with-cartesia/capability-guides/text-normalization).
        add_timestamps:
          type: boolean
          nullable: true
          default: false
          description: >-
            Whether to return word-level timestamps. If `false` (default), no
            word timestamps will be produced at all. If `true`, the server will
            return timestamp events containing word-level timing information.
        add_phoneme_timestamps:
          type: boolean
          nullable: true
          default: false
          description: >-
            Whether to return phoneme-level timestamps. If `false` (default), no
            phoneme timestamps will be produced. If `true`, the server will
            return timestamp events containing phoneme-level timing information.
        use_normalized_timestamps:
          type: boolean
          nullable: true
          description: >-
            Whether to use normalized timestamps (True) or original timestamps
            (False).
        pronunciation_dict_id:
          type: string
          nullable: true
          description: >-
            The ID of a pronunciation dictionary to use for the generation.
            Pronunciation dictionaries are supported by `sonic-3` models and
            newer.
        generation_config:
          $ref: '#/components/schemas/GenerationConfig'
        context_id:
          $ref: '#/components/schemas/SSEContextID'
          description: >-
            This can be any string value you find useful. The server will echo
            back the same `context_id` in events that it sends.

            > Contexts on the [TTS (WebSocket)](/api-reference/tts/websocket)
            endpoint are used for
            [continuations](/build-with-cartesia/capability-guides/stream-inputs-using-continuations).
            > The TTS (SSE) endpoint does not support continuations, so most
            users just ignore this property.
      required:
        - model_id
        - transcript
        - voice
        - output_format
    TTSSSEEvent:
      title: TTSSSEEvent
      description: An event emitted by the TTS SSE stream.
      oneOf:
        - $ref: '#/components/schemas/TTSSSEChunkEvent'
        - $ref: '#/components/schemas/TTSSSETimestampsEvent'
        - $ref: '#/components/schemas/TTSSSEPhonemeTimestampsEvent'
        - $ref: '#/components/schemas/TTSSSEDoneEvent'
        - $ref: '#/components/schemas/TTSSSEErrorEvent'
      discriminator:
        propertyName: type
        mapping:
          chunk:
            $ref: '#/components/schemas/TTSSSEChunkEvent'
          timestamps:
            $ref: '#/components/schemas/TTSSSETimestampsEvent'
          phoneme_timestamps:
            $ref: '#/components/schemas/TTSSSEPhonemeTimestampsEvent'
          done:
            $ref: '#/components/schemas/TTSSSEDoneEvent'
          error:
            $ref: '#/components/schemas/TTSSSEErrorEvent'
    SSEOutputFormat:
      title: SSEOutputFormat
      type: object
      properties:
        container:
          type: string
          enum:
            - raw
          default: raw
        encoding:
          $ref: '#/components/schemas/RawEncoding'
        sample_rate:
          type: integer
          enum:
            - 8000
            - 16000
            - 22050
            - 24000
            - 44100
            - 48000
      required:
        - container
        - encoding
        - sample_rate
    SSEContextID:
      title: SSEContextID
      type: string
      nullable: true
    TTSSSEChunkEvent:
      title: TTSSSEChunkEvent
      description: Audio data chunk.
      type: object
      example:
        type: chunk
        done: false
        status_code: 206
        step_time: 123
        context_id: 50dc3b5e-5841-4aa1-9f94-60cfb9aead79
        data: aSDinaTvuI8gbWludGxpZnk=
      properties:
        type:
          type: string
          enum:
            - chunk
          description: Event type identifier.
        done:
          type: boolean
          enum:
            - false
          description: >-
            Whether this is the final event for the request. Always `false` for
            chunk events.
        context_id:
          $ref: '#/components/schemas/SSEContextID'
          description: The context ID echoed back from the request, if one was provided.
        data:
          type: string
          description: Base64-encoded audio data.
        step_time:
          type: number
          description: Server-side processing time for this chunk in milliseconds.
        status_code:
          type: integer
          description: HTTP-style status code.
      required:
        - type
