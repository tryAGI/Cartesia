          anyOf:
            - type: string
              nullable: true
            - type: number
            - type: boolean
          description: Previous value, or null if the variable had no value
        new_value:
          anyOf:
            - type: string
            - type: number
            - type: boolean
          description: Assigned value
        updated_at:
          type: number
          description: Time of the update, in seconds since the call started
        tool_id:
          type: string
          description: ID of the configured tool that assigned the value
        tool_call_id:
          type: string
          description: >-
            ID of the tool call that assigned the value, matching
