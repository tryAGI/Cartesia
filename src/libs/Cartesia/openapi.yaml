          format: double
          description: Start time of the word in seconds.
        end:
          type: number
          format: double
          description: End time of the word in seconds.
      required:
        - word
        - start
        - end
    CreateManagedAgentV1Request:
      type: object
      properties:
        config:
          type: object
          properties:
            audio:
              type: object
              properties:
                input:
                  type: object
                  properties:
                    keyterms:
                      description: >-
                        Words or phrases that the speech recognizer should
                        prioritize.
                      type: array
                      items:
                        type: string
                    noise_suppression:
                      description: >-
                        Noise suppression applied to incoming audio. Use `off`
                        to disable it, `auto` for the default level, or `max`
                        for stronger suppression.
                      type: string
                      enum:
                        - 'off'
                        - auto
                        - max
                output:
                  type: object
                  properties:
                    background_sound:
                      description: >-
                        Background audio played during the conversation. Set to
                        `null` to disable it.
                      nullable: true
                      type: object
                      properties:
                        file_id:
                          description: ID of the audio file to play in the background.
                          type: string
                          minLength: 1
                        volume:
                          description: Background audio volume, from `0` to `2`.
                          type: number
                          maximum: 2
                          minimum: 0
                      required:
                        - file_id
                    emotion:
                      description: >-
                        Text-to-speech emotion supported by the selected voice
                        and model, such as `calm`, `happy`, or `sad`.
                      nullable: true
                      type: string
                      minLength: 1
                    pronunciation_dictionary_id:
                      description: >-
                        ID of the pronunciation dictionary used for agent
                        speech.
                      nullable: true
                      type: string
                      minLength: 1
                    speed:
                      description: >-
                        Speech speed multiplier, from `0.6` to `1.5`. Set to
                        `null` to use the default speed.
                      nullable: true
                      type: number
                      minimum: 0.6
                      maximum: 1.5
                    voice_id:
                      description: ID of the voice used for agent speech.
                      type: string
                      minLength: 1
                    volume:
                      description: >-
                        Speech volume multiplier, from `0.5` to `2`. Set to
                        `null` to use the default volume.
                      nullable: true
                      type: number
                      minimum: 0.5
                      maximum: 2
            dynamic_variable_placeholders:
              $ref: '#/components/schemas/ManagedAgentDynamicVariablePlaceholdersV1'
            initial_message:
              description: >-
                Message the agent says when the conversation begins. Set to
                `null` to wait for the user to speak first.
              nullable: true
              type: string
            instructions:
              description: Instructions that define the agent's behavior.
              type: string
            language:
              type: object
              properties:
                primary:
                  $ref: '#/components/schemas/ManagedAgentPrimaryLanguageV1'
            model:
              type: object
              properties:
                id:
                  description: Model ID from `GET /v1/agents/models`.
                  type: string
                  minLength: 1
                max_output_tokens:
                  description: >-
                    Maximum number of tokens the model can generate, from `1` to
                    `4096`. Set to `null` for no limit.
                  nullable: true
                  type: integer
                  minimum: 1
                  maximum: 4096
                temperature:
                  nullable: true
                  type: number
                  minimum: 0
                  maximum: 1
                  description: Controls the randomness of model responses, from `0` to `1`.
            system_tools:
              description: Built-in tools available to the agent.
              type: object
              properties:
                end_call:
                  description: >-
                    Configuration for ending the call. Omit or set to `null` to
                    disable this tool.
                  nullable: true
                  type: object
                  properties:
                    description:
                      description: >-
                        What the tool does and when the agent should use it. Set
                        to `null` to use the default system-optimized
                        description.
                      nullable: true
                      type: string
                      minLength: 1
                      maxLength: 2000
                    pre_tool_speech:
                      description: >-
                        Controls whether the agent speaks before using the tool.
                        `auto` lets the agent decide, while `force` asks the
                        agent to speak first.
                      type: string
                      enum:
                        - auto
                        - force
                send_dtmf:
                  description: >-
                    Configuration for sending DTMF tones. Omit or set to `null`
                    to disable this tool.
                  nullable: true
                  type: object
                  properties:
                    description:
                      description: >-
                        What the tool does and when the agent should use it. Set
                        to `null` to use the default system-optimized
                        description.
                      nullable: true
                      type: string
                      minLength: 1
                      maxLength: 2000
                    pre_tool_speech:
                      description: >-
                        Controls whether the agent speaks before using the tool.
                        `auto` lets the agent decide, while `force` asks the
                        agent to speak first.
                      type: string
                      enum:
                        - auto
                        - force
                transfer_to_number:
                  description: >-
                    Configuration for transferring the call. Omit or set to
                    `null` to disable this tool.
                  nullable: true
                  type: object
                  properties:
                    description:
                      description: >-
                        What the tool does and when the agent should use it. Set
                        to `null` to use the default system-optimized
                        description.
                      nullable: true
                      type: string
                      minLength: 1
                      maxLength: 2000
                    pre_tool_speech:
                      description: >-
                        Controls whether the agent speaks before using the tool.
                        `auto` lets the agent decide, while `force` asks the
                        agent to speak first.
                      type: string
                      enum:
                        - auto
                        - force
                    transfers:
                      description: Phone numbers the agent can transfer a call to.
                      type: array
                      items:
                        type: object
                        properties:
                          condition:
                            description: >-
                              When the agent should transfer the call to this
                              destination.
                            type: string
                            maxLength: 1000
                            minLength: 1
                          destination:
                            description: Where to transfer the call.
                            type: object
                            properties:
                              phone_number:
                                type: string
                                description: >-
                                  E.164 phone number or a single dynamic
                                  variable, such as `{{transfer_number}}`. Must
                                  resolve to a valid E.164 number when the tool
                                  runs.
                              type:
                                description: The destination type.
                                type: string
                                enum:
                                  - phone
                            required:
                              - type
                              - phone_number
                        required:
                          - destination
                          - condition
                      maxItems: 16
                      minItems: 1
                      uniqueItems: true
                  required:
                    - transfers
            timezone:
              type: string
              description: IANA time zone for `{{system__time}}`. Defaults to `UTC`.
              example: America/Los_Angeles
            tools:
              description: Tools available to the agent.
              type: array
              items:
                $ref: '#/components/schemas/ManagedAgentToolReferenceV1'
              maxItems: 32
              uniqueItems: true
        description:
          description: Description of the agent.
          nullable: true
          type: string
        name:
          description: Name shown for the agent. It does not need to be unique.
          type: string
          maxLength: 64
          minLength: 1
