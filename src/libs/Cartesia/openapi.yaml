  /agents/phone-numbers/providers/{id}:
    get:
      tags:
        - Providers
      summary: Get Provider
      description: Returns the details of a specific provider account.
      operationId: providers_get
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: id
          in: path
          description: The provider ID.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAccountResponse'
        '404':
          description: Provider not found.
      security:
        - APIKeyAuth: []
    patch:
      tags:
        - Providers
      summary: Update Provider
      description: >-
        Update a provider. To ensure assigned numbers are reachable, Twilio
        credentials are validated before saving. If the new credentials are
        invalid, the request fails and returns a list of unreachable numbers
        currently assigned to agents. For SIP trunks, omitted fields remain
        unchanged. Set `credentials` or `destination_country` to `null` to clear
        that field. Send `[]` to clear an inbound allowlist.
      operationId: providers_update
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: id
          in: path
          description: The provider ID.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderBody'
      responses:
        '200':
          description: Provider updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderAccountResponse'
        '400':
          description: >-
            Invalid credentials, invalid SIP trunk configuration, or Twilio
            numbers are unreachable with the new credentials.
        '404':
          description: Provider not found.
      security:
        - APIKeyAuth: []
    delete:
      tags:
        - Providers
      summary: Delete Provider
      description: Delete a provider account
      operationId: providers_delete
      parameters:
        - $ref: '#/components/parameters/CartesiaVersionHeader'
        - name: id
          in: path
          description: |-
            The provider ID.
            Delete linked phone numbers before deleting the provider.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Provider deleted.
        '404':
          description: Provider not found.
        '409':
          description: >-
            Provider has phone numbers. Remove all phone numbers using this
            provider before deleting it.
      security:
        - APIKeyAuth: []
